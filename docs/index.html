    .bookCover{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;isolation:isolate;flex:none;width:100%;aspect-ratio:2/3;padding:8px 5px 6px;border-radius:4px 8px 8px 4px;background:linear-gradient(145deg,var(--book-base),var(--book-dark));border:1px solid #fff6df70;border-left:5px solid #1b272d54;box-shadow:inset 2px 0 #ffffff18,inset -2px 0 #00000035,2px 4px 8px #25180f55;color:var(--book-ink);text-align:center;overflow:hidden;}

    .mapTools{position:absolute;z-index:2;right:12px;bottom:calc(min(31%,260px) + 14px);display:flex;gap:5px}
    .mapTools button{border:1px solid #fff9;background:#fff8ebed;color:#29474a;border-radius:12px;padding:9px 12px;min-height:42px;font-weight:700;box-shadow:0 3px 12px #21454735}
    #mapLoading{position:absolute;z-index:2;left:14px;right:14px;top:42%;padding:14px;border-radius:16px;background:#fff8ebed;text-align:center;font-size:13px}
    #mapLoading[hidden]{display:none}

    #residents button.active{background:#f2bc86;color:#674733}
  </style>

      }
      if(d.bookTab){e.stopImmediatePropagation();bookTab=d.bookTab;bookSelected=null;bookSceneSelected=null;bookFocused=null;showBookshop();return;}
      if(button.hasAttribute('data-book-shelf')){e.stopImmediatePropagation();bookTab='shelves';bookSelected=null;bookSceneSelected=null;bookFocused=null;showBookshop();return;}
      if(d.bookShelfFilter){e.stopImmediatePropagation();bookShelfFilter=d.bookShelfFilter;bookFocused=null;showBookshop();return;}
      if(d.bookCover){e.stopImmediatePropagation();bookFocused=d.bookCover;bookTab='shelves';showBookshop();return;}
      if(button.hasAttribute('data-book-cover-back')){e.stopImmediatePropagation();bookFocused=null;showBookshop();return;}
      if(d.bookFromCover){e.stopImmediatePropagation();bookTab='supply';bookSupplier=BOOK_BY_ID[d.bookFromCover].supplier;bookFocused=null;showBookshop();return;}
      if(d.bookScene){e.stopImmediatePropagation();if(availableBookScene(city.books.visitors.queue,city.books.scenes)?.id!==d.bookScene)return;bookSelected=null;bookSceneSelected=d.bookScene;bookTab='visitors';showBookshop();return;}
      if(d.bookSceneChoice!==undefined){e.stopImmediatePropagation();bookSceneAction(Number(d.bookSceneChoice));return;}
      if(button.hasAttribute('data-book-scene-back')){e.stopImmediatePropagation();bookSceneSelected=null;showBookshop();return;}
      if(d.bookSupplier){e.stopImmediatePropagation();bookSupplier=d.bookSupplier;showBookshop();return;}
      if(d.bookBuy){
        e.stopImmediatePropagation();
        if(city.paused){showBookshop('Сними игру с паузы перед заказом книг.');return;}
        const result=orderBook(city.books.inventory,d.bookBuy,Number(d.bookQty),city.coins);
        if(!result.ok){showBookshop(result.error);return;}
        city.coins-=result.cost;changed();
        showBookshop(`📦 Заказано ${d.bookQty} экз. «${BOOK_BY_ID[d.bookBuy].title}». Потрачено ${result.cost} 🪙. Книги уже в пути!`);
        return;
      }
      if(button.hasAttribute('data-book-go-supply')){e.stopImmediatePropagation();bookTab='supply';bookSupplier='needed';bookSelected=null;showBookshop();return;}
      if(d.bookVisitor){e.stopImmediatePropagation();bookSelected=d.bookVisitor;bookSceneSelected=null;bookTab='visitors';bookRoom='bookshop';showBookshop();return;}
      if(d.bookChoice!==undefined){e.stopImmediatePropagation();bookAction(Number(d.bookChoice));return;}
      if(button.hasAttribute('data-book-back')){e.stopImmediatePropagation();bookSelected=null;bookSceneSelected=null;showBookshop();return;}
      if(button.hasAttribute('data-book-refresh')){e.stopImmediatePropagation();showBookshop();return;}
    },true);
    dialog.onclick=async e=>{let t=e.target,c=city.coffee;if(t.dataset.bookRoom){const room=t.dataset.bookRoom;document.getElementById('bookScene').dataset.room=room;for(const button of dialog.querySelectorAll('[data-book-room]')){const active=button.dataset.bookRoom===room;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));}return;}if(t.dataset.book!==undefined){bookAction(Number(t.dataset.book));return;}if(t.hasAttribute('data-book-refresh')){showBookshop();return;}if(t.dataset.quest){if(t.dataset.answer!=='yes'){dialog.querySelector('p').textContent='Этот вариант не подходит. Попробуй ещё раз.';return;}c[t.dataset.quest]=true;cat(t.dataset.quest==='recipe'?'ryzhiy':'citera').xp+=6;close();notice(t.dataset.quest==='recipe'?'Рыжий придумал первую булочку.':'Цитера устроила книжный уголок в кофейне.');changed();return;}if(t.dataset.style){c.style=t.dataset.style;close();notice('Белла выбрала оформление кофейни. Выбранный стиль сохранён для дальнейшего оформления кофейни.');changed();return;}if(t.dataset.order!==undefined){if(Number(t.dataset.order)!==c.orders%3){dialog.querySelector('p').textContent='Это другой заказ. Гость подождёт, попробуй ещё раз.';return;}c.orders++;city.coins+=8;cat('ryzhiy').xp+=3;close();notice(`Заказ выполнен! +8 монет. Всего заказов: ${c.orders}.`);changed();return;}let id=t.id;if(e.target.hasAttribute('data-close'))close();if(id==='help')showGuide();if(id==='import')document.getElementById('file').click();if(id==='export'){await write().catch(()=>{});let blob=new Blob([JSON.stringify(city,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tihaya-buhta-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);close();notice('Копия сохранения загружена. Сохрани файл в «Файлы».');}if(id==='restore'||id==='restoreBeforeInventory'||id==='restoreBefore2D'||id==='restoreBeforePaths'){let prev=await read(id==='restoreBeforeInventory'?'before-book-inventory-v1':id==='restoreBefore2D'?'before-map-2d-v1':id==='restoreBeforePaths'?'before-paths-2d-v1':'previous').catch(()=>null);if(!prev||!valid(prev)){notice('Предыдущей исправной копии пока нет.');close();return;}if(confirm('Заменить текущий город предыдущей копией?')){city=sanitize(prev);city.savedAt=Date.now();changed();notice('Предыдущая копия восстановлена.');}close();}};
    document.getElementById('file').onchange=async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>200000){notice('Файл слишком большой.');close();return;}try{let data=JSON.parse(await f.text());if(!valid(data))throw Error('Неверный формат или версия файла.');if(!confirm('Заменить текущий город содержимым этого файла?'))return;city=sanitize(data);city.savedAt=Date.now();changed();close();notice('Город восстановлен из файла.');}catch(err){close();notice(`Не удалось импортировать: ${err.message}`);}};

    let map=null;
    function focusCity(x,y){map?.focus(x,y);}
    function frame(now){const dt=clamp((now-lastFrame)/1000,0,.1);lastFrame=now;simulate(dt);map?.render(now);requestAnimationFrame(frame);}
    async function preserveOldMap(saved){if(!saved)return;for(const [limit,key] of [[6,'before-map-2d-v1'],[8,'before-paths-2d-v1'],[10,'before-book-inventory-v1'],[11,'before-book-shelves-v1']]){if(saved.version>=limit||await read(key))continue;await new Promise((resolve,reject)=>{const tx=db.transaction('saves','readwrite');tx.objectStore('saves').put(saved,key);tx.oncomplete=resolve;tx.onerror=reject;});}}
    async function start(){
      try{db=await openDB();const saved=await read(KEY),previous=await read('previous');const restored=valid(previous)&&(!valid(saved)||previous.version>saved.version);const source=restored?previous:saved;await preserveOldMap(source);city=valid(source)?sanitize(source):initial();if(saved&&!valid(source))notice('Сохранение повреждено или создано другой версией. Начат новый город.');else if(source){offline();if(restored)notice('Восстановлен прогресс из более новой резервной копии. Закрой старые вкладки игры.');else if(source.version<FORMAT)notice('В лавке появились витрина и новые беседы! Монеты, книги, поставки и истории сохранены.');}else notice('Коснись кота или выбери жителя в панели.');const delivered=receiveBookShipments(city.books.inventory);if(delivered.length)notice(`📦 Получено поставок: ${delivered.length}. Книги ждут на полке.`);await write();}
      catch(err){city=city||initial();notice('Автосохранение недоступно. Экспортируй прогресс через ☰.');}
      try{map=createMap({canvas,catArt:CAT_ART,getCity:()=>city,getSelected:()=>selected,onSelect:id=>{selected=id;renderUI();notice('Выбран житель: '+byId[id].name+'.');},onLocation:id=>showLocation(id),onNotice:notice});renderUI();requestAnimationFrame(frame);}
      catch(err){notice('Не удалось открыть карту: '+err.message);}
      setInterval(()=>{if(dirty)write().catch(()=>{})},15000);
      setInterval(()=>{
        if(!city)return;
        if(city.books.inventory.shipments.length){const deliveries=receiveBookShipments(city.books.inventory);if(deliveries.length){changed();notice(`📦 Книжная лавка: прибыло ${deliveries.reduce((n,s)=>n+s.qty,0)} экз.`);if(!overlay.hidden&&dialog.classList.contains('bookshop')&&bookTab==='supply')showBookshop('📦 Заказ доставлен и книги появились на полке!');}}
        if(city.paused||overlay.hidden||!dialog.classList.contains('bookshop'))return;
        if(bringNextBookVisitor(city.books.visitors)){changed();if(bookTab==='visitors'&&!bookSelected)showBookshop('🐾 В лавку заглянул новый посетитель!');}
      },3000);
      document.addEventListener('visibilitychange',()=>{if(document.hidden&&dirty)write().catch(()=>{});lastFrame=performance.now();});
    }
    start();
})();
  </script>
