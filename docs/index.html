<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2c5a60">
  <title>Тихая бухта · город Беллы</title>
  <style>
    :root { color-scheme: light; font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#273f40; background:#b6d8d0; }
    * { box-sizing:border-box; }
    html { margin:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; }
    body { margin:0; position:fixed; top:0; left:0; width:var(--screen-w,100vw); height:var(--screen-h,100dvh); overflow:hidden; overscroll-behavior:none; touch-action:none; }
    button { font:inherit; cursor:pointer; touch-action:manipulation; }
    #world { position:absolute; inset:0; width:100%; height:100%; touch-action:none; background:linear-gradient(#9fd0cc,#b8d9ca 70%); }
    .top { position:absolute; z-index:2; top:0; left:0; right:0; padding:calc(env(safe-area-inset-top) + 10px) 14px 8px; display:flex; align-items:center; justify-content:space-between; gap:8px; pointer-events:none; }
    .brand,.money,.icon { box-shadow:0 3px 18px #315b5a25; border:1px solid #fff9; background:#fff8ebed; }
    .brand { padding:7px 12px; border-radius:16px; min-width:0; }
    .brand strong { display:block; font-size:15px; white-space:nowrap; }
    .brand small { display:block; font-size:10px; opacity:.75; }
    .topRight { display:flex; gap:7px; pointer-events:auto; }
    .money { padding:10px; border-radius:14px; font-weight:800; white-space:nowrap; }
    .icon { width:43px; height:43px; border-radius:14px; border-color:#fff9; font-size:19px; }
    .hint { position:absolute; z-index:2; top:calc(env(safe-area-inset-top) + 75px); left:50%; transform:translateX(-50%); text-align:center; background:#193e40c8; color:white; border-radius:22px; padding:7px 12px; font-size:11px; white-space:nowrap; pointer-events:none; }
    .sheet { position:absolute; z-index:3; bottom:0; left:0; right:0; height:min(31%,260px); overflow:auto; touch-action:pan-y; overscroll-behavior:contain; padding:11px 15px calc(env(safe-area-inset-bottom) + 12px); background:#fff9ed; border-radius:24px 24px 0 0; box-shadow:0 -8px 35px #22444532; }
    .grab { width:36px; height:4px; border-radius:4px; background:#c7d7ce; margin:0 auto 8px; }
    .row { display:flex; gap:10px; align-items:center; }
    .avatar { width:43px; height:43px; flex:none; border-radius:50%; background:#d8ece4; display:grid; place-items:center; font-size:27px; }
    h1 { margin:0; font-size:19px; line-height:1.2; }
    .sub { margin:3px 0 0; color:#587171; font-size:12px; }
    .stats { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
    .stat { border-radius:10px; padding:5px 8px; background:#e7efe7; font-size:11px; }
    .actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
    .action { min-height:42px; padding:8px; border:0; border-radius:12px; background:#dcece3; color:#27484b; font-size:12px; font-weight:700; }
    .action.primary { background:#f2bc86; }
    .action:disabled { opacity:.45; }
    #message { min-height:32px; margin:10px 0 0; color:#496665; font-size:12px; line-height:1.35; }
    .overlay { position:absolute; inset:0; z-index:5; background:#173a3eb5; display:grid; place-items:center; padding:18px; }
    .overlay[hidden] { display:none; }
    .dialog { width:min(100%,380px); max-height:85svh; overflow:auto; border-radius:23px; padding:20px; background:#fff9ed; box-shadow:0 16px 50px #102c2c66; }
    .dialog h2 { margin:0 0 8px; font-size:21px; }
    .dialog p { line-height:1.45; font-size:13px; }
    .dialog button { display:block; width:100%; padding:13px; margin-top:8px; border:0; border-radius:12px; background:#dcece3; color:#27484b; font-weight:700; }
    .dialog button:first-of-type { background:#f2bc86; }
    .dialog small { color:#647979; }
    #file { display:none; }
  </style>
</head>
<body>
  <canvas id="world" aria-label="Карта города Тихая бухта"></canvas>
  <header class="top">
    <div class="brand"><strong>Тихая бухта</strong><small>город Беллы · прототип 0.1</small></div>
    <div class="topRight"><div class="money" id="money">🪙 0</div><button class="icon" id="pause" aria-label="Пауза">Ⅱ</button><button class="icon" id="settings" aria-label="Сохранения и помощь">☰</button></div>
  </header>
  <div class="hint">Перетаскивай карту · двумя пальцами меняй масштаб</div>
  <section class="sheet" id="sheet"><div class="grab"></div><div id="details"></div><p id="message" role="status" aria-live="polite"></p></section>
  <div class="overlay" id="overlay" hidden><div class="dialog" id="dialog"></div></div>
  <input id="file" type="file" accept="application/json,.json">
  <script>
  (() => {
    'use strict';
    const FORMAT=4, DB='quiet-bay-save', KEY='city';
    const cafeSite={id:'cafe',name:'Кофейня',home:[5,11.2],roof:'#c98165'};
    const scenicSites=[
      {id:'bookshop',name:'Книги',home:[3.7,6],roof:'#b37f75',wall:'#f1dcc5',floors:2},
      {id:'observatory',name:'Обсерватория',home:[8,.5],roof:'#7a91ad',wall:'#e8e4d9',floors:2},
      {id:'club',name:'Клуб',home:[12.8,1.7],roof:'#aa6f68',wall:'#e7d3b9',floors:2},
      {id:'hotel',name:'Отель',home:[18.5,6.3],roof:'#d19573',wall:'#f4ddc2',floors:3},
      {id:'post',name:'Почта',home:[17.4,8.5],roof:'#79a6a7',wall:'#eadcc9',floors:2},
      {id:'market',name:'Рынок',home:[0,9.6],roof:'#e6a460',wall:'#e8d1ad',floors:1},
      {id:'townhall',name:'Ратуша',home:[8.5,5.2],roof:'#99a6a3',wall:'#efe1cd',floors:2},
      {id:'marina',name:'Лодочная',home:[13.4,13.9],roof:'#7da6b1',wall:'#d6c4a7',floors:1},
      {id:'greenhouse',name:'Оранжерея',home:[.3,6.8],roof:'#8aab94',wall:'#d7e5d2',floors:1},
      {id:'restaurant',name:'Ресторан',home:[7.3,9],roof:'#b16f67',wall:'#f2d3b1',floors:2},
      {id:'office_west',name:'Офис',home:[11,3.2],roof:'#7d9da2',wall:'#e7ded1',floors:2},
      {id:'office_east',name:'Офис',home:[16.1,4.1],roof:'#9e94ad',wall:'#e9e3d8',floors:3},
      {id:'residence_hill',name:'Жилой дом',home:[4.5,3.7],roof:'#b88470',wall:'#ead8c2',floors:2},
      {id:'residence_east',name:'Жилой дом',home:[14.8,9.1],roof:'#909fa6',wall:'#e9d6c0',floors:3},
      {id:'residence_coast',name:'Жилой дом',home:[5.1,14.1],roof:'#c69a7e',wall:'#efdfc9',floors:2},
      {id:'residence_far',name:'Жилой дом',home:[19.5,12.8],roof:'#9ba690',wall:'#eee0cb',floors:2}
    ];
    const defs=[
      {id:'kent',name:'Кент',job:'боксёр',color:'#8e9290',roof:'#9c6d61',home:[1.2,2.1],work:[12.8,1.7],face:'tabby',symbol:'🥊'},
      {id:'mia',name:'Мия',job:'провидица',color:'#fafaf1',roof:'#8c9bb4',home:[5.4,1.2],work:[8,.5],face:'mia',symbol:'✦'},
      {id:'lev',name:'Лев',job:'администратор',color:'#f4eee2',roof:'#9b8167',home:[12.6,6.1],work:[8.5,5.2],face:'lev',symbol:'📋'},
      {id:'citera',name:'Цитера',job:'курьер',color:'#383b3d',roof:'#b08791',home:[16.7,11.4],work:[17.4,8.5],face:'citera',symbol:'✉'},
      {id:'ryzhiy',name:'Рыжий',job:'пекарь',color:'#d98546',roof:'#d2946a',home:[2.1,12.4],work:[5,11.2],face:'ryzhiy',symbol:'🥐'},
      {id:'bella',name:'Белла',job:'хозяйка города',color:'#fff8f0',roof:'#e8a0ae',home:[9,13],work:[8.3,8.2],face:'bella',symbol:'♡'}
    ];
    const byId=Object.fromEntries(defs.map(d=>[d.id,d]));
    const activities={work:'работает',rest:'отдыхает',eat:'ест',play:'играет',walk:'гуляет'};
    const canvas=document.getElementById('world'), ctx=canvas.getContext('2d');
    const details=document.getElementById('details'), msg=document.getElementById('message');
    const overlay=document.getElementById('overlay'), dialog=document.getElementById('dialog');
    let db, city, selected='bella', view={x:0,y:-120,zoom:1}, pointers=new Map(), gesture=null;
    let lastFrame=performance.now(), saveTimer=0, dirty=false, time=0;
    function initial(){return {version:FORMAT,coins:30,paused:false,savedAt:Date.now(),coffee:{built:false,plan:false,delivery:false,recipe:false,style:null,orders:0},cats:defs.map(d=>({id:d.id,x:d.home[0],y:d.home[1],target:[...d.home],activity:d.id==='bella'?'walk':'work',hunger:80,energy:80,mood:75,xp:0,level:1,phase:0,upgrades:{bed:0,bowl:0,toy:0}}))};}
    function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
    function valid(s){return s&&[1,2,3,FORMAT].includes(s.version)&&Number.isFinite(s.coins)&&s.coins>=0&&Array.isArray(s.cats)&&s.cats.length===defs.length&&defs.every(d=>{let c=s.cats.find(x=>x.id===d.id);return c&&[c.x,c.y,c.hunger,c.energy,c.mood,c.xp,c.level].every(Number.isFinite)&&c.upgrades&&['bed','bowl','toy'].every(k=>Number.isInteger(c.upgrades[k])&&c.upgrades[k]>=0&&c.upgrades[k]<=3);});}
    function sanitize(s){let out=initial();out.coins=clamp(Math.floor(s.coins),0,10000000);out.paused=!!s.paused;out.savedAt=Number.isFinite(s.savedAt)?s.savedAt:Date.now();if(s.version>=2&&s.coffee&&typeof s.coffee==='object'){let v=s.coffee;out.coffee={built:!!v.built,plan:!!v.plan,delivery:!!v.delivery,recipe:!!v.recipe,style:['coral','mint','blue'].includes(v.style)?v.style:null,orders:clamp(Number.isFinite(v.orders)?Math.floor(v.orders):0,0,100000)};}out.cats=defs.map(d=>{let v=s.cats.find(x=>x.id===d.id),c=out.cats.find(x=>x.id===d.id);return {...c,x:s.version<FORMAT?d.home[0]:clamp(v.x,0,20.5),y:s.version<FORMAT?d.home[1]:clamp(v.y,0,15),target:s.version<FORMAT?[...d.home]:Array.isArray(v.target)&&v.target.length===2&&v.target.every(Number.isFinite)?v.target.map(z=>clamp(z,0,20.5)):[...d.home],activity:Object.hasOwn(activities,v.activity)?v.activity:'walk',hunger:clamp(v.hunger,0,100),energy:clamp(v.energy,0,100),mood:clamp(v.mood,0,100),xp:clamp(v.xp,0,1000000),level:clamp(Math.floor(v.level),1,100),phase:clamp(Number(v.phase)||0,0,30),upgrades:{bed:v.upgrades.bed,bowl:v.upgrades.bowl,toy:v.upgrades.toy}};});return out;}
    async function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('saves');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
    function read(key){return new Promise((resolve,reject)=>{let t=db.transaction('saves','readonly'),r=t.objectStore('saves').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
    function write(){if(!db||!city)return Promise.resolve();city.savedAt=Date.now();let snapshot=JSON.parse(JSON.stringify(city));dirty=false;return new Promise((resolve,reject)=>{let t=db.transaction('saves','readwrite'),s=t.objectStore('saves');s.get(KEY).onsuccess=e=>{if(e.target.result)s.put(e.target.result,'previous');s.put(snapshot,KEY);};t.oncomplete=resolve;t.onerror=()=>{dirty=true;reject(t.error);};});}
    function changed(){dirty=true;renderUI();clearTimeout(saveTimer);saveTimer=setTimeout(()=>write().catch(()=>notice('Не удалось сохранить. Экспортируй копию через ☰.')),900);}
    function notice(t){msg.textContent=t;}
    function cat(id){return city.cats.find(c=>c.id===id);}
    function targetFor(c,a){let d=byId[c.id];if(a==='rest'||a==='eat')return [...d.home];if(a==='work')return [...d.work];if(a==='play')return [5.7,5.1];return [2+Math.random()*16,2+Math.random()*11];}
    function assign(c,a,announce=true){c.activity=a;c.target=targetFor(c,a);c.phase=0;if(announce){notice(`${byId[c.id].name}: ${activities[a]}. ${a==='work'?'Заработает монеты и опыт после работы.':a==='rest'?'Восстановит бодрость дома.':a==='eat'?'Восполнит сытость дома.':a==='play'?'Поднимет настроение.':'Идёт на прогулку.'}`);changed();}}
    function auto(c){if(c.id==='bella')return;if(c.hunger<30)assign(c,'eat',false);else if(c.energy<24)assign(c,'rest',false);else if(c.mood<25)assign(c,'play',false);else {let a=Math.random();assign(c,a<.62?'work':a<.83?'walk':'play',false);}dirty=true;}
    function simulate(dt){if(city.paused)return;time+=dt;for(let c of city.cats){let dx=c.target[0]-c.x,dy=c.target[1]-c.y,dist=Math.hypot(dx,dy);if(dist>.03){let step=Math.min(dist,dt*(c.id==='citera'?.42:.30));c.x+=dx/dist*step;c.y+=dy/dist*step;continue;}c.phase+=dt;if(c.id==='bella'){if(c.phase>7)assign(c,'walk',false);continue;}c.hunger=clamp(c.hunger-dt*.18,0,100);c.energy=clamp(c.energy-dt*(c.activity==='rest'?-1.5:.16),0,100);if(c.activity==='eat'){c.hunger=clamp(c.hunger+dt*(1.7+c.upgrades.bowl*.6),0,100);if(c.phase>9)auto(c);}else if(c.activity==='rest'){if(c.phase>12||c.energy>=95)auto(c);}else if(c.activity==='play'){c.mood=clamp(c.mood+dt*(1.5+c.upgrades.toy*.5),0,100);if(c.phase>10)auto(c);}else if(c.activity==='work'){if(c.phase>11){let reward=5+c.level+Math.floor(c.mood/40);city.coins+=reward;c.xp+=4;c.mood=clamp(c.mood-2,0,100);if(c.xp>=c.level*18){c.xp-=c.level*18;c.level++;notice(`${byId[c.id].name} достиг${['mia','citera'].includes(c.id)?'ла':''} уровня ${c.level}!`);}else if(selected===c.id)notice(`${byId[c.id].name} заработал ${reward} монет и 4 опыта.`);auto(c);renderUI();}}else if(c.phase>8){c.mood=clamp(c.mood+5,0,100);auto(c);}}}
    function offline(){let elapsed=clamp((Date.now()-city.savedAt)/1000,0,4*3600);let blocks=Math.min(24,Math.floor(elapsed/600));if(!blocks)return;let gain=city.paused?0:blocks*city.cats.filter(c=>c.id!=='bella').length*3;city.coins+=gain;notice(gain?`Пока тебя не было, жители принесли ${gain} монет. Начислено не больше чем за 4 часа.`:'Город был на паузе.');dirty=true;}
    function homeCost(c,k){return {bed:20,bowl:15,toy:18}[k]*(c.upgrades[k]+1);}
    function improve(k){let c=cat(selected),cost=homeCost(c,k);if(city.coins<cost){notice(`Нужно ещё ${cost-city.coins} монет.`);return;}city.coins-=cost;c.upgrades[k]++;let names={bed:'Кровать',bowl:'Миска',toy:'Игрушки'};notice(`${byId[c.id].name}: ${names[k].toLowerCase()}, уровень ${c.upgrades[k]}. ${k==='bed'?'Отдых теперь быстрее.':k==='bowl'?'Еда восполняется быстрее.':'Игра лучше поднимает настроение.'}`);changed();}
    function cafeReady(){let c=city.coffee;return c.plan&&c.delivery&&c.recipe&&c.style;}
    function renderCafe(){let c=city.coffee,done=[c.plan,c.delivery,c.recipe,!!c.style].filter(Boolean).length;details.innerHTML=`<div class="row"><div class="avatar">☕</div><div><h1>Кофейня Рыжего</h1><p class="sub">${c.built?'Открыта · заказов выполнено: '+c.orders:'Подготовка к открытию · '+done+'/4 поручений'}</p></div></div><div class="stats"><span class="stat">${c.built?'Рыжий печёт, Цитера доставляет, Лев организует':'Общая цель города'}</span>${c.style?'<span class="stat">Оформление: '+({coral:'коралловое',mint:'мятное',blue:'морское'}[c.style])+'</span>':''}</div><div class="actions">${c.built?`<button class="action primary" data-cafe="order">Выполнить заказ · +8 🪙</button><button class="action" data-cafe="focus">Показать кофейню</button>`:`<button class="action" data-cafe="plan" ${c.plan?'disabled':''}>📋 План Льва ${c.plan?'✓':''}</button><button class="action" data-cafe="delivery" ${c.delivery?'disabled':''}>✉ Доставка Цитеры ${c.delivery?'✓':''}</button><button class="action" data-cafe="recipe" ${c.recipe?'disabled':''}>🥐 Рецепт Рыжего ${c.recipe?'✓':''}</button><button class="action" data-cafe="style">🎨 Оформление ${c.style?'✓':''}</button><button class="action primary" data-cafe="build" ${!cafeReady()||city.coins<80?'disabled':''}>Открыть · 80 🪙</button><button class="action" data-cafe="focus">Показать на карте</button>`}</div>`;}
    function coffeeAction(a){let c=city.coffee;if(a==='focus'){let p=iso(...cafeSite.home);view.x=-p[0]*view.zoom;view.y=-p[1]*view.zoom-30;return;}if(a==='plan'&&!c.plan){c.plan=true;cat('lev').xp+=6;notice('Лев составил план открытия. Осталось организовать доставку, рецепт и оформление.');changed();return;}if(a==='delivery'&&!c.delivery)show('<h2>Посылка Цитеры</h2><p>Оборудование ждёт у пирса. Куда его везти для кофейни?</p><button data-quest="delivery" data-answer="yes">С пирса к кофейне</button><button data-quest="delivery" data-answer="no">Из парка к дому Кента</button><button data-close>Позже</button>');if(a==='recipe'&&!c.recipe)show('<h2>Первый рецепт Рыжего</h2><p>Нужна сладкая булочка к открытию. Что добавим в тесто?</p><button data-quest="recipe" data-answer="yes">Корицу и немного сахара</button><button data-quest="recipe" data-answer="no">Соль и морскую воду</button><button data-close>Позже</button>');if(a==='style')show('<h2>Белла выбирает оформление</h2><p>Цвет крыши и вывески будет виден на карте.</p><button data-style="coral">Коралловое</button><button data-style="mint">Мятное</button><button data-style="blue">Морское</button><button data-close>Позже</button>');if(a==='build'){if(!cafeReady()||city.coins<80)return;city.coins-=80;c.built=true;notice('Кофейня открыта! Коснись её снова, чтобы выполнять заказы посетителей.');changed();}if(a==='order'&&c.built){let names=['Булочка с корицей','Ягодный чай','Какао'],n=c.orders%3;show(`<h2>Заказ посетителя</h2><p>Гость просит: <b>${names[n]}</b>. Что подать?</p>${names.map((name,i)=>`<button data-order="${i}">${name}</button>`).join('')}<button data-close>Позже</button>`);}}
    function renderUI(){if(!city)return;document.getElementById('money').textContent=`🪙 ${city.coins}`;document.getElementById('pause').textContent=city.paused?'▶':'Ⅱ';if(selected==='cafe'){renderCafe();return;}let c=cat(selected),d=byId[selected];let bella=c.id==='bella';details.innerHTML=`<div class="row"><div class="avatar">${d.symbol}</div><div><h1>${d.name} <span style="font-size:12px;font-weight:400">${bella?'':`· уровень ${c.level}`}</span></h1><p class="sub">${d.job} · ${activities[c.activity]}</p></div></div><div class="stats">${bella?'<span class="stat">Гуляет и навещает друзей</span>':`<span class="stat">🥣 ${Math.round(c.hunger)}%</span><span class="stat">💤 ${Math.round(c.energy)}%</span><span class="stat">♡ ${Math.round(c.mood)}%</span><span class="stat">✦ ${Math.floor(c.xp)}/${c.level*18} опыта</span>`}</div><div class="actions">${bella?'<button class="action primary" data-action="cafe">☕ Кофейня</button><button class="action" data-action="guide">Как играть</button><button class="action" data-action="focus">Показать на карте</button>':`<button class="action primary" data-action="work">Работать · +монеты</button><button class="action" data-action="rest">Отдыхать · +бодрость</button><button class="action" data-action="eat">Кормить · +сытость</button><button class="action" data-action="play">Играть · +настроение</button><button class="action" data-action="walk">Гулять</button><button class="action" data-action="focus">Показать на карте</button><button class="action" data-upgrade="bed" ${c.upgrades.bed>=3?'disabled':''}>🛏 Кровать ${c.upgrades.bed}/3 · ${homeCost(c,'bed')} 🪙</button><button class="action" data-upgrade="bowl" ${c.upgrades.bowl>=3?'disabled':''}>🥣 Миска ${c.upgrades.bowl}/3 · ${homeCost(c,'bowl')} 🪙</button><button class="action" data-upgrade="toy" ${c.upgrades.toy>=3?'disabled':''}>🧶 Игрушки ${c.upgrades.toy}/3 · ${homeCost(c,'toy')} 🪙</button>`}</div>`;}

    function resize(){let w=innerWidth,h=innerHeight;if(!cameraFramed){view.x=148;view.y=-h*.53;cameraFramed=true;}document.body.style.setProperty('--screen-w',`${w}px`);document.body.style.setProperty('--screen-h',`${h}px`);canvas.width=w;canvas.height=h;}
    function scheduleResize(){clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(pointers.size)scheduleResize();else resize();},250);}
    function pick(x,y){let hits=city.cats.map(c=>({id:c.id,dist:Math.hypot(point(c.x,c.y)[0]-x,point(c.x,c.y)[1]-22*view.zoom-y)})).filter(a=>a.dist<29*view.zoom).sort((a,b)=>a.dist-b.dist);if(hits.length)return hits[0].id;let [cx,cy]=point(...cafeSite.home);if(Math.hypot(cx-x,cy-20*view.zoom-y)<46*view.zoom)return 'cafe';hits=defs.map(d=>({id:d.id,dist:Math.hypot(point(...d.home)[0]-x,point(...d.home)[1]-28*view.zoom-y)})).filter(a=>a.dist<40*view.zoom).sort((a,b)=>a.dist-b.dist);return hits[0]?.id;}
    canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});gesture={x:e.clientX,y:e.clientY,moved:false};});
    canvas.addEventListener('pointermove',e=>{let old=pointers.get(e.pointerId);if(!old)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});let all=[...pointers.values()];if(all.length===1){view.x+=e.clientX-old.x;view.y+=e.clientY-old.y;if(Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)>8)gesture.moved=true;}else if(all.length===2){let other=all.find(p=>p!==pointers.get(e.pointerId)),oldDist=Math.hypot(old.x-other.x,old.y-other.y),newDist=Math.hypot(e.clientX-other.x,e.clientY-other.y);if(oldDist>10)view.zoom=clamp(view.zoom*newDist/oldDist,.7,2.1);gesture.moved=true;}});
    function pointerEnd(e){let old=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(old&&gesture&&!gesture.moved&&pointers.size===0){let id=pick(e.clientX,e.clientY);if(id){selected=id;renderUI();notice(id==='cafe'?'Кофейня выбрана.':`${byId[id].name} выбран${['mia','citera','bella'].includes(id)?'а':''}.`);}}}
    canvas.addEventListener('pointerup',e=>{pointerEnd(e);if(!pointers.size)scheduleResize();});canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);if(!pointers.size)scheduleResize();});
    canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
    function frame(now){let dt=clamp((now-lastFrame)/1000,0,.1);lastFrame=now;simulate(dt);draw();requestAnimationFrame(frame);}
    async function start(){try{db=await openDB();let saved=await read(KEY);city=valid(saved)?sanitize(saved):initial();if(saved&&!valid(saved))notice('Сохранение повреждено или создано другой версией. Начат новый город.');else if(saved)offline();else notice('Коснись кота или дома. Коты заботятся о себе сами.');await write();}catch(err){city=initial();notice('Хранилище Safari недоступно: игра работает, но сохранение может пропасть.');}resize();renderUI();requestAnimationFrame(frame);setInterval(()=>{if(dirty)write().catch(()=>{});},15000);document.addEventListener('visibilitychange',()=>{if(document.hidden&&dirty)write().catch(()=>{});});}
    window.addEventListener('resize',scheduleResize);start();
  })();
  </script>
