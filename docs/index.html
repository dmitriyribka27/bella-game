<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2c5a60">
  <title>Тихая бухта · город Беллы</title>
  <style>
    :root { color-scheme: light; font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#273f40; background:#b6d8d0; }
    * { box-sizing:border-box; }
    html { margin:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; }
    body { margin:0; position:fixed; top:0; left:0; width:var(--screen-w,100vw); height:var(--screen-h,100dvh); overflow:hidden; overscroll-behavior:none; touch-action:none; }
    button { font:inherit; cursor:pointer; touch-action:manipulation; }
    #world { position:absolute; inset:0; width:100%; height:100%; touch-action:none; background:#233c54; }
    #catLabels{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
    .catLabel{position:absolute;transform:translate(-50%,-100%);padding:4px 9px;border-radius:14px;background:#fff9efdb;border:1px solid #fffdf3b8;box-shadow:0 3px 10px #2145474d;color:#29474a;font-family:ui-rounded,"Arial Rounded MT Bold",-apple-system,system-ui,sans-serif;font-size:12px;font-weight:650;letter-spacing:.01em;white-space:nowrap;text-shadow:0 1px #ffffffb8;backdrop-filter:blur(4px)}
    .catLabel.selected{background:#fff1d8ed;border-color:#f9dba7;color:#6a4c41}
    .top { position:absolute; z-index:2; top:0; left:0; right:0; padding:calc(env(safe-area-inset-top) + 10px) 14px 8px; display:flex; align-items:center; justify-content:space-between; gap:8px; pointer-events:none; }
    .brand,.money,.icon { box-shadow:0 3px 18px #315b5a25; border:1px solid #fff9; background:#fff8ebed; }
    .brand { padding:7px 12px; border-radius:16px; min-width:0; }
    .brand strong { display:block; font-size:15px; white-space:nowrap; }
    .brand small { display:block; font-size:10px; opacity:.75; }
    .topRight { display:flex; gap:7px; pointer-events:auto; }
    .money { padding:10px; border-radius:14px; font-weight:800; white-space:nowrap; }
    .icon { width:43px; height:43px; border-radius:14px; border-color:#fff9; font-size:19px; }
    .hint { position:absolute; z-index:2; top:calc(env(safe-area-inset-top) + 75px); left:50%; transform:translateX(-50%); text-align:center; background:#193e40c8; color:white; border-radius:22px; padding:7px 12px; font-size:11px; white-space:nowrap; pointer-events:none; }
    .sheet { position:absolute; z-index:3; bottom:0; left:0; right:0; height:min(31%,260px); overflow:auto; touch-action:pan-y; overscroll-behavior:contain; padding:11px 15px calc(env(safe-area-inset-bottom) + 12px); background:#fff9ed; border-radius:24px 24px 0 0; box-shadow:0 -8px 35px #22444532; }
    .grab { width:36px; height:4px; border-radius:4px; background:#c7d7ce; margin:0 auto 8px; }
    .row { display:flex; gap:10px; align-items:center; }
    .avatar { width:43px; height:43px; flex:none; border-radius:50%; background:#d8ece4; display:grid; place-items:center; font-size:27px; }
    h1 { margin:0; font-size:19px; line-height:1.2; }
    .sub { margin:3px 0 0; color:#587171; font-size:12px; }
    .stats { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
    .stat { border-radius:10px; padding:5px 8px; background:#e7efe7; font-size:11px; }
    .actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
    .action { min-height:42px; padding:8px; border:0; border-radius:12px; background:#dcece3; color:#27484b; font-size:12px; font-weight:700; }
    .action.primary { background:#f2bc86; }
    .action:disabled { opacity:.45; }
    #message { min-height:32px; margin:10px 0 0; color:#496665; font-size:12px; line-height:1.35; }
    .overlay { position:absolute; inset:0; z-index:5; background:#173a3eb5; display:grid; place-items:center; padding:18px; }
    .overlay[hidden] { display:none; }
    .dialog { width:min(100%,380px); max-height:85svh; overflow:auto; border-radius:23px; padding:20px; background:#fff9ed; box-shadow:0 16px 50px #102c2c66; }
    .dialog h2 { margin:0 0 8px; font-size:21px; }
    .dialog p { line-height:1.45; font-size:13px; }
    .dialog button { display:block; width:100%; padding:13px; margin-top:8px; border:0; border-radius:12px; background:#dcece3; color:#27484b; font-weight:700; }
    .dialog button:first-of-type { background:#f2bc86; }
    .dialog small { color:#647979; }
    .dialog.bookshop { width:min(100%,440px); padding:14px; }
    .bookInterior { display:block; width:100%; aspect-ratio:1.31; object-fit:cover; border-radius:15px; background:#493b32; margin:10px 0; }
    .shopStatus { display:block; padding:8px 10px; border-radius:10px; background:#eee8d7; color:#594a3e; font-size:12px; }
    #file { display:none; }
    .mapTools{position:absolute;z-index:2;right:12px;bottom:calc(min(31%,260px) + 14px);display:flex;gap:5px}
    .mapTools button{border:1px solid #fff9;background:#fff8ebed;color:#29474a;border-radius:12px;padding:9px 12px;min-height:42px;font-weight:700;box-shadow:0 3px 12px #21454735}
    #mapLoading{position:absolute;z-index:2;left:14px;right:14px;top:42%;padding:14px;border-radius:16px;background:#fff8ebed;text-align:center;font-size:13px}
    #mapLoading[hidden]{display:none}
    #residents{display:flex;gap:5px;overflow-x:auto;margin:0 0 9px;padding:2px 0;scrollbar-width:none}
    #residents button{border:0;border-radius:10px;padding:6px 9px;background:#e4eee5;color:#315357;white-space:nowrap;font-size:11px}
    #residents button.active{background:#f2bc86;color:#674733}
  </style>
</head>
<body>
  <canvas id="world" aria-label="Карта города Тихая бухта"></canvas>
  <div id="catLabels" aria-hidden="true"></div>
  <header class="top">
    <div class="brand"><strong>Тихая бухта</strong><small>город Беллы · версия 0.3 · 2D</small></div>
    <div class="topRight"><div class="money" id="money">🪙 0</div><button class="icon" id="pause" aria-label="Пауза">Ⅱ</button><button class="icon" id="settings" aria-label="Сохранения и помощь">☰</button></div>
  </header>
  <div class="hint">Перетаскивай город · двумя пальцами меняй масштаб</div>
  <div class="mapTools" aria-label="Масштаб карты"><button id="fitMap">Весь остров</button><button id="zoomOut" aria-label="Отдалить">−</button><button id="zoomIn" aria-label="Приблизить">+</button></div>
  <div id="mapLoading" role="status">Загружаем остров…</div>
  <section class="sheet" id="sheet"><div class="grab"></div><div id="residents" aria-label="Выбрать жителя"></div><div id="details"></div><p id="message" role="status" aria-live="polite"></p></section>
  <div class="overlay" id="overlay" hidden><div class="dialog" id="dialog"></div></div>
  <input id="file" type="file" accept="application/json,.json">
  <script type="module">
import {CAT_ART} from "./cats-art.js?v=1";
import {BOOKSHOP_ART} from "./bookshop-art.js?v=2";
import {createMap,HOME_POINTS,WORK_POINTS,SITE_POINTS,NODES,advance,walkTarget} from "./map2d.js?v=4";
(()=>{"use strict";
    const FORMAT=8, DB='quiet-bay-save', KEY='city';
    const cafeSite={id:'cafe',name:'Кофейня',home:[5,11.2],roof:'#c98165'};
    const scenicSites=[
      {id:'bookshop',name:'Городская читальня',home:[3.7,6],roof:'#b37f75',wall:'#f1dcc5',floors:2},
      {id:'observatory',name:'Обсерватория',home:[8,.5],roof:'#7a91ad',wall:'#e8e4d9',floors:2},
      {id:'club',name:'Клуб',home:[12.8,1.7],roof:'#aa6f68',wall:'#e7d3b9',floors:2},
      {id:'hotel',name:'Отель',home:[18.5,6.3],roof:'#d19573',wall:'#f4ddc2',floors:3},
      {id:'post',name:'Почта',home:[17.2,9.1],roof:'#79a6a7',wall:'#eadcc9',floors:2},
      {id:'market',name:'Рынок',home:[0,9.6],roof:'#e6a460',wall:'#e8d1ad',floors:1},
      {id:'townhall',name:'Ратуша',home:[8.5,5.2],roof:'#99a6a3',wall:'#efe1cd',floors:2},
      {id:'marina',name:'Лодочная',home:[13.4,13.9],roof:'#7da6b1',wall:'#d6c4a7',floors:1},
      {id:'greenhouse',name:'Оранжерея',home:[.3,6.8],roof:'#8aab94',wall:'#d7e5d2',floors:1},
      {id:'restaurant',name:'Ресторан',home:[8,9.2],roof:'#b16f67',wall:'#f2d3b1',floors:2},
      {id:'office_west',name:'Офис',home:[10.5,3],roof:'#7d9da2',wall:'#e7ded1',floors:2},
      {id:'office_east',name:'Офис',home:[16.1,4.1],roof:'#9e94ad',wall:'#e9e3d8',floors:3},
      {id:'residence_hill',name:'Жилой дом',home:[4.5,3.7],roof:'#b88470',wall:'#ead8c2',floors:2},
      {id:'residence_east',name:'Жилой дом',home:[14.8,9.1],roof:'#909fa6',wall:'#e9d6c0',floors:3},
      {id:'residence_coast',name:'Жилой дом',home:[5.1,14.1],roof:'#c69a7e',wall:'#efdfc9',floors:2},
      {id:'residence_far',name:'Жилой дом',home:[19.5,12.8],roof:'#9ba690',wall:'#eee0cb',floors:2}
    ];
    const defs=[
      {id:'kent',name:'Кент',job:'боксёр',color:'#8e9290',roof:'#9c6d61',home:[1.2,2.1],work:[12.8,1.7],face:'tabby',symbol:'🥊'},
      {id:'mia',name:'Мия',job:'провидица',color:'#fafaf1',roof:'#8c9bb4',home:[5.4,1.2],work:[8,.5],face:'mia',symbol:'✦'},
      {id:'lev',name:'Лев',job:'администратор',color:'#f4eee2',roof:'#9b8167',home:[12.6,6.1],work:[8.5,5.2],face:'lev',symbol:'📋'},
      {id:'citera',name:'Цитера',job:'хозяйка книжной лавки',color:'#383b3d',roof:'#b08791',home:[16.7,11.0],work:[16.3,12.0],face:'citera',symbol:'📚'},
      {id:'ryzhiy',name:'Рыжий',job:'пекарь',color:'#d98546',roof:'#d2946a',home:[2.1,12.4],work:[5,11.2],face:'ryzhiy',symbol:'🥐'},
      {id:'bella',name:'Белла',job:'хозяйка города',color:'#fff8f0',roof:'#e8a0ae',home:[9,13],work:[8.3,8.2],face:'bella',symbol:'♡'}
    ];
    for(const d of defs){d.home=[...HOME_POINTS[d.id]];d.work=[...WORK_POINTS[d.id]];}
    cafeSite.home=[...NODES.cafe];for(const d of scenicSites){if(SITE_POINTS[d.id])d.home=[...SITE_POINTS[d.id]];}
    const byId=Object.fromEntries(defs.map(d=>[d.id,d]));
    const activities={work:'работает',rest:'отдыхает',eat:'ест',play:'играет',walk:'гуляет'};
    const canvas=document.getElementById('world');
    const details=document.getElementById('details'), msg=document.getElementById('message');
    const overlay=document.getElementById('overlay'), dialog=document.getElementById('dialog');
    let db, city, selected='bella', gesture=null;
    let lastFrame=performance.now(), saveTimer=0, dirty=false, time=0;
    function initial(){return {version:FORMAT,coins:30,paused:false,savedAt:Date.now(),coffee:{built:false,plan:false,delivery:false,recipe:false,style:null,orders:0},books:{orders:0,nextAt:0},cats:defs.map(d=>({id:d.id,x:d.home[0],y:d.home[1],target:[...d.home],activity:d.id==='bella'?'walk':'work',hunger:80,energy:80,mood:75,xp:0,level:1,phase:0,upgrades:{bed:0,bowl:0,toy:0}}))};}
    function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
    function valid(s){return s&&[1,2,3,4,5,6,7,FORMAT].includes(s.version)&&Number.isFinite(s.coins)&&s.coins>=0&&(s.version<5||s.books&&Number.isInteger(s.books.orders)&&Number.isFinite(s.books.nextAt))&&Array.isArray(s.cats)&&s.cats.length===defs.length&&defs.every(d=>{let c=s.cats.find(x=>x.id===d.id);return c&&[c.x,c.y,c.hunger,c.energy,c.mood,c.xp,c.level].every(Number.isFinite)&&c.upgrades&&['bed','bowl','toy'].every(k=>Number.isInteger(c.upgrades[k])&&c.upgrades[k]>=0&&c.upgrades[k]<=3);});}
    function sanitize(s){let out=initial();out.coins=clamp(Math.floor(s.coins),0,10000000);out.paused=!!s.paused;out.savedAt=Number.isFinite(s.savedAt)?s.savedAt:Date.now();if(s.version>=2&&s.coffee&&typeof s.coffee==='object'){let v=s.coffee;out.coffee={built:!!v.built,plan:!!v.plan,delivery:!!v.delivery,recipe:!!v.recipe,style:['coral','mint','blue'].includes(v.style)?v.style:null,orders:clamp(Number.isFinite(v.orders)?Math.floor(v.orders):0,0,100000)};}if(s.version>=5&&s.books&&typeof s.books==='object'){out.books={orders:clamp(Math.floor(s.books.orders),0,100000),nextAt:clamp(s.books.nextAt,0,Date.now()+86400000)};}out.cats=defs.map(d=>{let v=s.cats.find(x=>x.id===d.id),c=out.cats.find(x=>x.id===d.id);return {...c,x:s.version<4?d.home[0]:clamp(v.x,0,20.5),y:s.version<4?d.home[1]:clamp(v.y,0,15),target:s.version<4?[...d.home]:s.version<5&&d.id==='citera'&&v.activity==='work'?[...d.work]:Array.isArray(v.target)&&v.target.length===2&&v.target.every(Number.isFinite)?v.target.map(z=>clamp(z,0,20.5)):[...d.home],activity:Object.hasOwn(activities,v.activity)?v.activity:'walk',hunger:clamp(v.hunger,0,100),energy:clamp(v.energy,0,100),mood:clamp(v.mood,0,100),xp:clamp(v.xp,0,1000000),level:clamp(Math.floor(v.level),1,100),phase:clamp(Number(v.phase)||0,0,30),upgrades:{bed:v.upgrades.bed,bowl:v.upgrades.bowl,toy:v.upgrades.toy}};});if(s.version<FORMAT){for(const c of out.cats){const d=byId[c.id];c.x=d.home[0];c.y=d.home[1];c.target=c.activity==='work'?[...d.work]:c.activity==='play'?[...NODES.square]:[...d.home];c.phase=0;}}return out;}
    async function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('saves');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
    function read(key){return new Promise((resolve,reject)=>{let t=db.transaction('saves','readonly'),r=t.objectStore('saves').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
    function write(){if(!db||!city)return Promise.resolve();city.savedAt=Date.now();let snapshot=JSON.parse(JSON.stringify(city));dirty=false;return new Promise((resolve,reject)=>{let t=db.transaction('saves','readwrite'),s=t.objectStore('saves');s.get(KEY).onsuccess=e=>{if(e.target.result)s.put(e.target.result,'previous');s.put(snapshot,KEY);};t.oncomplete=resolve;t.onerror=()=>{dirty=true;reject(t.error);};});}
    function changed(){dirty=true;map?.invalidate();renderUI();clearTimeout(saveTimer);saveTimer=setTimeout(()=>write().catch(()=>notice('Не удалось сохранить. Экспортируй копию через ☰.')),900);}
    function notice(t){msg.textContent=t;}
    function cat(id){return city.cats.find(c=>c.id===id);}
    function targetFor(c,a){let d=byId[c.id];if(a==='rest'||a==='eat')return [...d.home];if(a==='work')return [...d.work];if(a==='play')return [...NODES.square];return walkTarget();}
    function assign(c,a,announce=true){c.activity=a;c.target=targetFor(c,a);c.phase=0;if(announce){notice(`${byId[c.id].name}: ${activities[a]}. ${a==='work'?'Заработает монеты и опыт после работы.':a==='rest'?'Восстановит бодрость дома.':a==='eat'?'Восполнит сытость дома.':a==='play'?'Поднимет настроение.':'Идёт на прогулку.'}`);changed();}}
    function auto(c){if(c.id==='bella')return;if(c.hunger<30)assign(c,'eat',false);else if(c.energy<24)assign(c,'rest',false);else if(c.mood<25)assign(c,'play',false);else {let a=Math.random();assign(c,a<.62?'work':a<.83?'walk':'play',false);}dirty=true;}
    function simulate(dt){if(city.paused)return;time+=dt;for(let c of city.cats){let dx=c.target[0]-c.x,dy=c.target[1]-c.y,dist=Math.hypot(dx,dy);if(dist>.03){advance(c,dt);continue;}c.phase+=dt;if(c.id==='bella'){if(c.phase>7)assign(c,'walk',false);continue;}c.hunger=clamp(c.hunger-dt*.18,0,100);c.energy=clamp(c.energy-dt*(c.activity==='rest'?-1.5:.16),0,100);if(c.activity==='eat'){c.hunger=clamp(c.hunger+dt*(1.7+c.upgrades.bowl*.6),0,100);if(c.phase>9)auto(c);}else if(c.activity==='rest'){if(c.phase>12||c.energy>=95)auto(c);}else if(c.activity==='play'){c.mood=clamp(c.mood+dt*(1.5+c.upgrades.toy*.5),0,100);if(c.phase>10)auto(c);}else if(c.activity==='work'){if(c.phase>11){let reward=5+c.level+Math.floor(c.mood/40);city.coins+=reward;c.xp+=4;c.mood=clamp(c.mood-2,0,100);if(c.xp>=c.level*18){c.xp-=c.level*18;c.level++;notice(`${byId[c.id].name} достиг${['mia','citera'].includes(c.id)?'ла':''} уровня ${c.level}!`);}else if(selected===c.id)notice(`${byId[c.id].name} заработал ${reward} монет и 4 опыта.`);auto(c);renderUI();}}else if(c.phase>8){c.mood=clamp(c.mood+5,0,100);auto(c);}}}
    function offline(){let elapsed=clamp((Date.now()-city.savedAt)/1000,0,4*3600);let blocks=Math.min(24,Math.floor(elapsed/600));if(!blocks)return;let gain=city.paused?0:blocks*city.cats.filter(c=>c.id!=='bella').length*3;city.coins+=gain;notice(gain?`Пока тебя не было, жители принесли ${gain} монет. Начислено не больше чем за 4 часа.`:'Город был на паузе.');dirty=true;}
    function homeCost(c,k){return {bed:20,bowl:15,toy:18}[k]*(c.upgrades[k]+1);}
    function improve(k){let c=cat(selected),cost=homeCost(c,k);if(city.coins<cost){notice(`Нужно ещё ${cost-city.coins} монет.`);return;}city.coins-=cost;c.upgrades[k]++;let names={bed:'Кровать',bowl:'Миска',toy:'Игрушки'};notice(`${byId[c.id].name}: ${names[k].toLowerCase()}, уровень ${c.upgrades[k]}. ${k==='bed'?'Отдых теперь быстрее.':k==='bowl'?'Еда восполняется быстрее.':'Игра лучше поднимает настроение.'}`);changed();}
    function cafeReady(){let c=city.coffee;return c.plan&&c.delivery&&c.recipe&&c.style;}
    function renderCafe(){let c=city.coffee,done=[c.plan,c.delivery,c.recipe,!!c.style].filter(Boolean).length;details.innerHTML=`<div class="row"><div class="avatar">☕</div><div><h1>Кофейня Рыжего</h1><p class="sub">${c.built?'Открыта · заказов выполнено: '+c.orders:'Подготовка к открытию · '+done+'/4 поручений'}</p></div></div><div class="stats"><span class="stat">${c.built?'Рыжий печёт, Цитера подбирает книги, Лев организует':'Общая цель города'}</span>${c.style?'<span class="stat">Оформление: '+({coral:'коралловое',mint:'мятное',blue:'морское'}[c.style])+'</span>':''}</div><div class="actions">${c.built?`<button class="action primary" data-cafe="order">Выполнить заказ · +8 🪙</button><button class="action" data-cafe="focus">Показать кофейню</button>`:`<button class="action" data-cafe="plan" ${c.plan?'disabled':''}>📋 План Льва ${c.plan?'✓':''}</button><button class="action" data-cafe="delivery" ${c.delivery?'disabled':''}>📚 Книжный уголок Цитеры ${c.delivery?'✓':''}</button><button class="action" data-cafe="recipe" ${c.recipe?'disabled':''}>🥐 Рецепт Рыжего ${c.recipe?'✓':''}</button><button class="action" data-cafe="style">🎨 Оформление ${c.style?'✓':''}</button><button class="action primary" data-cafe="build" ${!cafeReady()||city.coins<80?'disabled':''}>Открыть · 80 🪙</button><button class="action" data-cafe="focus">Показать на карте</button>`}</div>`;}
    function coffeeAction(a){let c=city.coffee;if(a==='focus'){focusCity(...cafeSite.home);return;}if(a==='plan'&&!c.plan){c.plan=true;cat('lev').xp+=6;notice('Лев составил план открытия. Осталось организовать доставку, рецепт и оформление.');changed();return;}if(a==='delivery'&&!c.delivery)show('<h2>Книжный уголок Цитеры</h2><p>Цитера принесла книги для гостей кофейни. Где устроить книжную полку?</p><button data-quest="delivery" data-answer="yes">В кофейне, рядом с уютными столиками</button><button data-quest="delivery" data-answer="no">На складе вдали от посетителей</button><button data-close>Позже</button>');if(a==='recipe'&&!c.recipe)show('<h2>Первый рецепт Рыжего</h2><p>Нужна сладкая булочка к открытию. Что добавим в тесто?</p><button data-quest="recipe" data-answer="yes">Корицу и немного сахара</button><button data-quest="recipe" data-answer="no">Соль и морскую воду</button><button data-close>Позже</button>');if(a==='style')show('<h2>Белла выбирает оформление</h2><p>Выбор сохраняется в прогрессе кофейни; её подробное оформление проработаем отдельно.</p><button data-style="coral">Коралловое</button><button data-style="mint">Мятное</button><button data-style="blue">Морское</button><button data-close>Позже</button>');if(a==='build'){if(!cafeReady()||city.coins<80)return;city.coins-=80;c.built=true;notice('Кофейня открыта! Коснись её снова, чтобы выполнять заказы посетителей.');changed();}if(a==='order'&&c.built){let names=['Булочка с корицей','Ягодный чай','Какао'],n=c.orders%3;show(`<h2>Заказ посетителя</h2><p>Гость просит: <b>${names[n]}</b>. Что подать?</p>${names.map((name,i)=>`<button data-order="${i}">${name}</button>`).join('')}<button data-close>Позже</button>`);}}
    const bookRequests=[
      {wish:'историю про море и маяки',books:['Морские истории','Атлас созвездий','Пироги и булочки'],right:0},
      {wish:'книгу о звёздах для Мии',books:['Морские истории','Атлас созвездий','Пироги и булочки'],right:1},
      {wish:'рецепты для Рыжего',books:['Морские истории','Атлас созвездий','Пироги и булочки'],right:2}
    ];
    function showBookshop(note=''){
      selected='citera';renderUI();let b=city.books,remaining=Math.max(0,Math.ceil((b.nextAt-Date.now())/1000));
      let req=bookRequests[b.orders%bookRequests.length];
      show(`<h2>Книжная лавка Цитеры</h2><img id="bookInterior" class="bookInterior" alt="Тёплый книжный магазин с полками, креслом и прилавком"><span class="shopStatus">Помогли ${b.orders} посетителям · Цитера работает здесь</span><p>${note||(!remaining?`Посетитель ищет ${req.wish}. Что предложим?`:`Следующий посетитель заглянет примерно через ${remaining} сек. Можно пока заниматься городом.`)}</p>${!remaining?req.books.map((name,i)=>`<button data-book="${i}">${name}</button>`).join(''):'<button data-book-refresh>Проверить посетителей</button>'}<button data-close>Вернуться в город</button>`);
      dialog.classList.add('bookshop');document.getElementById('bookInterior').src=BOOKSHOP_ART.interior.src;
    }
    function bookAction(i){let b=city.books,req=bookRequests[b.orders%bookRequests.length];if(city.paused){showBookshop('Город на паузе. Продолжи игру, чтобы помочь посетителю.');return;}
      if(Date.now()<b.nextAt){showBookshop();return;}
      if(i!==req.right){showBookshop('Эта книга с другой полки. Посетитель ищет '+req.wish+'.');return;}
      b.orders++;b.nextAt=Date.now()+30000;city.coins+=7;let c=cat('citera');c.xp+=4;c.mood=clamp(c.mood+3,0,100);
      changed();showBookshop('Цитера нашла нужную книгу! +7 монет, +4 опыта и +3 настроения. Новый гость заглянет чуть позже.');
    }
    function renderUI(){if(!city)return;document.getElementById('money').textContent=`🪙 ${city.coins}`;document.getElementById('pause').textContent=city.paused?'▶':'Ⅱ';if(selected==='cafe'){renderCafe();return;}let c=cat(selected),d=byId[selected];let bella=c.id==='bella';details.innerHTML=`<div class="row"><div class="avatar">${d.symbol}</div><div><h1>${d.name} <span style="font-size:12px;font-weight:400">${bella?'':`· уровень ${c.level}`}</span></h1><p class="sub">${d.job} · ${activities[c.activity]}</p></div></div><div class="stats">${bella?'<span class="stat">Гуляет и навещает друзей</span>':`<span class="stat">🥣 ${Math.round(c.hunger)}%</span><span class="stat">💤 ${Math.round(c.energy)}%</span><span class="stat">♡ ${Math.round(c.mood)}%</span><span class="stat">✦ ${Math.floor(c.xp)}/${c.level*18} опыта</span>`}</div><div class="actions">${bella?'<button class="action primary" data-action="cafe">☕ Кофейня</button><button class="action" data-action="guide">Как играть</button><button class="action" data-action="focus">Показать на карте</button>':`<button class="action primary" data-action="work">Работать · +монеты</button><button class="action" data-action="rest">Отдыхать · +бодрость</button><button class="action" data-action="eat">Кормить · +сытость</button><button class="action" data-action="play">Играть · +настроение</button><button class="action" data-action="walk">Гулять</button>${c.id==='citera'?'<button class="action primary" data-action="bookshop">📚 Войти в книжную лавку</button>':''}<button class="action" data-action="focus">Показать на карте</button><button class="action" data-upgrade="bed" ${c.upgrades.bed>=3?'disabled':''}>🛏 Кровать ${c.upgrades.bed}/3 · ${homeCost(c,'bed')} 🪙</button><button class="action" data-upgrade="bowl" ${c.upgrades.bowl>=3?'disabled':''}>🥣 Миска ${c.upgrades.bowl}/3 · ${homeCost(c,'bowl')} 🪙</button><button class="action" data-upgrade="toy" ${c.upgrades.toy>=3?'disabled':''}>🧶 Игрушки ${c.upgrades.toy}/3 · ${homeCost(c,'toy')} 🪙</button>`}</div>`;}
    details.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.cafe){coffeeAction(b.dataset.cafe);return;}if(b.dataset.action==='cafe'){selected='cafe';renderUI();notice('Помоги жителям открыть кофейню.');return;}if(b.dataset.action==='guide')showGuide();else if(b.dataset.action==='bookshop')showBookshop();else if(b.dataset.action==='focus'){let c=cat(selected);focusCity(c.x,c.y);}else if(b.dataset.action)assign(cat(selected),b.dataset.action);else if(b.dataset.upgrade)improve(b.dataset.upgrade);});
    function close(){overlay.hidden=true;dialog.classList.remove('bookshop');}
    function show(html){dialog.classList.remove('bookshop');dialog.innerHTML=html;overlay.hidden=false;}
    function showGuide(){show(`<h2>Добро пожаловать в бухту</h2><p>Коснись кота или домика, чтобы выбрать жителя. Коты сами работают, едят и отдыхают. Назначай им занятия, помогай с настроением и трать общие монеты на предметы для дома.</p><p>Перетаскивай город одним пальцем и меняй масштаб двумя. Выбери кота и коснись здания, чтобы он подошёл к входу по дорожке. Пауза остановит время. Прогресс хранится в Safari на этом устройстве.</p><p>Коснись дома Цитеры, чтобы зайти в её книжную лавку и помочь посетителям. Кофейню Рыжего открой через поручения в панели Беллы.</p><button data-close>Играть</button>`);}
    document.getElementById('settings').onclick=()=>show(`<h2>Город и сохранение</h2><p>Игра сохраняется автоматически в Safari. Для переноса на другое устройство экспортируй файл JSON и импортируй его там.</p><button id="export">Экспортировать сохранение</button><button id="import">Импортировать файл</button><button id="restore">Вернуть предыдущую копию</button><button id="restoreBefore2D">Копия до перехода в 2D</button><button id="restoreBeforePaths">Копия до новых маршрутов</button><button id="help">Как играть</button><button data-close>Закрыть</button><small>Не очищай данные Safari до экспорта. Формат сохранения: ${FORMAT}.</small>`);
    document.getElementById('pause').onclick=()=>{city.paused=!city.paused;notice(city.paused?'Город на паузе.':'Город снова живёт.');changed();};
    dialog.onclick=async e=>{let t=e.target,c=city.coffee;if(t.dataset.book!==undefined){bookAction(Number(t.dataset.book));return;}if(t.hasAttribute('data-book-refresh')){showBookshop();return;}if(t.dataset.quest){if(t.dataset.answer!=='yes'){dialog.querySelector('p').textContent='Этот вариант не подходит. Попробуй ещё раз.';return;}c[t.dataset.quest]=true;cat(t.dataset.quest==='recipe'?'ryzhiy':'citera').xp+=6;close();notice(t.dataset.quest==='recipe'?'Рыжий придумал первую булочку.':'Цитера устроила книжный уголок в кофейне.');changed();return;}if(t.dataset.style){c.style=t.dataset.style;close();notice('Белла выбрала оформление кофейни. Выбранный стиль сохранён для дальнейшего оформления кофейни.');changed();return;}if(t.dataset.order!==undefined){if(Number(t.dataset.order)!==c.orders%3){dialog.querySelector('p').textContent='Это другой заказ. Гость подождёт, попробуй ещё раз.';return;}c.orders++;city.coins+=8;cat('ryzhiy').xp+=3;close();notice(`Заказ выполнен! +8 монет. Всего заказов: ${c.orders}.`);changed();return;}let id=t.id;if(e.target.hasAttribute('data-close'))close();if(id==='help')showGuide();if(id==='import')document.getElementById('file').click();if(id==='export'){await write().catch(()=>{});let blob=new Blob([JSON.stringify(city,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tihaya-buhta-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);close();notice('Копия сохранения загружена. Сохрани файл в «Файлы».');}if(id==='restore'||id==='restoreBefore2D'||id==='restoreBeforePaths'){let prev=await read(id==='restoreBefore2D'?'before-map-2d-v1':id==='restoreBeforePaths'?'before-paths-2d-v1':'previous').catch(()=>null);if(!prev||!valid(prev)){notice('Предыдущей исправной копии пока нет.');close();return;}if(confirm('Заменить текущий город предыдущей копией?')){city=sanitize(prev);city.savedAt=Date.now();changed();notice('Предыдущая копия восстановлена.');}close();}};
    document.getElementById('file').onchange=async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>200000){notice('Файл слишком большой.');close();return;}try{let data=JSON.parse(await f.text());if(!valid(data))throw Error('Неверный формат или версия файла.');if(!confirm('Заменить текущий город содержимым этого файла?'))return;city=sanitize(data);city.savedAt=Date.now();changed();close();notice('Город восстановлен из файла.');}catch(err){close();notice(`Не удалось импортировать: ${err.message}`);}};

    let map=null;
    function focusCity(x,y){map?.focus(x,y);}
    function frame(now){const dt=clamp((now-lastFrame)/1000,0,.1);lastFrame=now;simulate(dt);map?.render(now);requestAnimationFrame(frame);}
    async function preserveOldMap(saved){if(!saved)return;for(const [limit,key] of [[6,'before-map-2d-v1'],[FORMAT,'before-paths-2d-v1']]){if(saved.version>=limit||await read(key))continue;await new Promise((resolve,reject)=>{const tx=db.transaction('saves','readwrite');tx.objectStore('saves').put(saved,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}}
    async function start(){
      try{db=await openDB();const saved=await read(KEY);await preserveOldMap(saved);city=valid(saved)?sanitize(saved):initial();if(saved&&!valid(saved))notice('Сохранение повреждено или создано другой версией. Начат новый город.');else if(saved){offline();if(saved.version<FORMAT)notice('Коты вернулись на дорожки. Монеты, уровни и улучшения сохранены.');}else notice('Коснись кота или выбери жителя в панели.');await write();}
      catch(err){city=city||initial();notice('Автосохранение недоступно. Экспортируй прогресс через ☰.');}
      try{map=createMap({canvas,catArt:CAT_ART,getCity:()=>city,getSelected:()=>selected,onSelect:id=>{selected=id;renderUI();notice('Выбран житель: '+byId[id].name+'.');},onHome:(id,entrance)=>{selected=id;const c=cat(id);c.activity='walk';c.target=[...entrance];c.phase=0;changed();if(id==='citera')showBookshop();else notice('Дом '+byId[id].name+'. Житель идёт к входу.');},onCafe:entrance=>{const c=cat(selected==='cafe'?'ryzhiy':selected);c.activity='walk';c.target=[...entrance];c.phase=0;selected='cafe';changed();},onVisit:(id,entrance)=>{const c=cat(selected==='cafe'?'ryzhiy':selected);c.activity='walk';c.target=[...entrance];c.phase=0;changed();notice(byId[c.id].name+' идёт к зданию по дорожке.');},onNotice:notice});renderUI();requestAnimationFrame(frame);}
      catch(err){notice('Не удалось открыть карту: '+err.message);}
      setInterval(()=>{if(dirty)write().catch(()=>{})},15000);
      document.addEventListener('visibilitychange',()=>{if(document.hidden&&dirty)write().catch(()=>{});lastFrame=performance.now();});
    }
    start();
})();
  </script>
</body>
</html>
