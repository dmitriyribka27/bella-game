<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#183d43">
  <meta name="robots" content="noindex,nofollow">
  <title>Bella — проверка подключения</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: #183d43; color: #fff5e5; font-family: system-ui, sans-serif; }
    main { width: min(100%, 420px); }
    small { color: #b9d6cb; letter-spacing: .1em; }
    h1 { font-size: clamp(32px, 9vw, 48px); line-height: 1.1; }
    p { line-height: 1.6; }
    button { width: 100%; min-height: 56px; border: 0; border-radius: 16px;
      background: #ffd49c; color: #183d43; font: inherit; font-weight: 700;
      touch-action: manipulation; cursor: pointer; }
    #result { min-height: 3em; color: #b9d6cb; }
  </style>
</head>
<body>
  <main>
    <small>BELLA · ТЕХНИЧЕСКАЯ ПРОВЕРКА · 0.0.1</small>
    <h1>Начало маленького мира</h1>
    <p>Это проверочная страница будущей игры. Она нужна, чтобы проверить ссылку и касания на iPhone.</p>
    <button id="check" type="button">Проверить касание</button>
    <p id="result" role="status" aria-live="polite">Нажми кнопку — здесь появится результат.</p>
    <p>Игра, установка на домашний экран и офлайн-режим пока не готовы.</p>
  </main>
  <script>
    let taps = 0;
    document.querySelector('#check').addEventListener('click', () => {
      taps += 1;
      document.querySelector('#result').textContent = `Касания работают. Нажатий: ${taps}.`;
    });
  </script>
</body>
</html>
