    .cafeCanvas { position:relative; width:100%; height:100%; transform-origin:center; transition:transform .3s ease; }

    .cafeGuestLayer{position:absolute;inset:0;pointer-events:none;}
    .cafeGuestTrack{position:absolute;inset:0;pointer-events:none;transform:translate3d(var(--cafe-x),var(--cafe-y),0);}
    .cafeGuestTrack[data-slot="0"]{--cafe-x:51%;--cafe-y:64%;--table-x:46%;--table-y:77%;}
    .cafeGuestTrack[data-slot="1"]{--cafe-x:62%;--cafe-y:65%;--table-x:69%;--table-y:68%;}
    .cafeGuestTrack[data-route="enter"]{animation:cafeGuestEnter 3.2s ease-out both;}
    .cafeGuestTrack[data-route="enjoy"]{animation:cafeGuestEnjoy 11s ease-in-out both;}
    .dialog .cafeGuestSprite{position:absolute;left:0;top:0;transform:translate(-50%,-65%);min-width:0;width:auto;margin:0;padding:3px 5px 4px;display:grid;justify-items:center;gap:0;background:#fff9e9ed;border:1px solid #ffe3ac;border-radius:12px;box-shadow:0 3px 10px #20180b88;color:#3b4c43;pointer-events:auto;}
    .cafeGuestSprite svg{width:clamp(29px,7vw,39px);height:clamp(34px,8vw,44px);display:block;filter:drop-shadow(0 2px 1px #2b3c3e66);}

    .dialog .cafeGuestTrack[data-route="enjoy"] .cafeGuestSprite{pointer-events:none;}
    .cafeGuestSprite::after{content:'💬';position:absolute;top:-13px;right:-10px;padding:2px;background:#fff9e7;border-radius:50%;font-size:12px;}
    .cafeGuestTrack[data-route="enjoy"] .cafeGuestSprite::after{content:'☕';}
    .cafeScene[data-paused="true"] .cafeGuestTrack{animation-play-state:paused;}
    @keyframes cafeGuestEnter{0%{opacity:0;transform:translate3d(87%,70%,0) scale(.85)}16%{opacity:1}55%{transform:translate3d(77%,72%,0)}100%{opacity:1;transform:translate3d(var(--cafe-x),var(--cafe-y),0)}}
    @keyframes cafeGuestEnjoy{0%{opacity:1;transform:translate3d(var(--cafe-x),var(--cafe-y),0)}23%{transform:translate3d(var(--table-x),var(--table-y),0)}67%{transform:translate3d(var(--table-x),var(--table-y),0)}87%{opacity:1;transform:translate3d(84%,72%,0)}100%{opacity:0;transform:translate3d(92%,76%,0)}}

    function simulate(dt){

        if(dist>.03){advance(c,dt);continue;}
        c.phase+=dt;
        if(c.id==='bella'){if(c.phase>7)assign(c,'walk',false);continue;}
        c.hunger=clamp(c.hunger-dt*.18,0,100);

          if(c.phase>9)auto(c);
        }else if(c.activity==='rest'){

          // Manual rest is also allowed to last a little while at full energy.
          const isNight=catRoutinePeriod(minuteOfGameDay(city.clock))==='night';
          if(c.phase>12&&(!isNight||c.hunger<MIN_WORK_NEED)||!isNight&&c.phase>7&&c.energy>=95)auto(c);

          c.mood=clamp(c.mood+dt*homeRecoveryRate('play',c.upgrades),0,100);
          if(c.phase>10)auto(c);

    function setupOfflineCaching(){

      });
      navigator.serviceWorker.register('./sw.js').then(async registration=>{
        await navigator.serviceWorker.ready;
        (registration.active||navigator.serviceWorker.controller)?.postMessage({type:'CACHE_ALL'});
      }).catch(()=>{offlineCacheStatus='⚠️ Офлайн-копию не удалось подготовить. Сохранения города от этого не удаляются.';});

      const result=spinLighthouseSlots(city,{bet:free?SLOT_FREE_BET:slotBet,free,day});
      if(!result.ok){
        const msg=result.reason==='funds'?`Не хватает ${result.shortfall} 🪙. Попробуй уменьшить ставку.`:result.reason==='free-used'?'Сегодня бесплатный спин уже был. Завтра появится новый.':'Не удалось запустить барабаны.';
        showLighthouseSlots(msg);return;
      }
      slotBusy=true;
      slotVisibleBalance=balanceBeforeSpin;
      const spinId=++slotSpinId;
      changed();clearTimeout(saveTimer);
      showLighthouseSlots('🎲 Барабаны крутятся…',true);
      const interval=setInterval(()=>{
        if(spinId!==slotSpinId){clearInterval(interval);return;}
        for(const reel of dialog.querySelectorAll('.slotReels.rolling>span'))reel.textContent=['🍒','🍋','🍊','🍇'][Math.floor(Math.random()*4)];
      },85);
      let saved=true;
      try{await Promise.all([write(),new Promise(resolve=>setTimeout(resolve,1550))]);}
      catch{saved=false;slotSaveFailed=true;saveWarning();}
      clearInterval(interval);
      if(spinId!==slotSpinId)return;
      slotBusy=false;
      slotVisibleBalance=null;
      renderUI();
      if(saved){if(result.delta>0)gameAudio.coinGain();else if(result.delta<0)gameAudio.coinSpend();}
      if(dialog.classList.contains('lighthouseSlotDialog'))showLighthouseSlots(saved?'':`⚠️ Не удалось сохранить вращение. Новые ставки заблокированы. Экспортируй сохранение через меню ☰ и перезапусти игру.`);
    }

      }else if(vis.queue.length){

      const personalHotspots=atHome?CITERA_HOME_STORIES.map(story=>`<button class="bookHomeHotspot" data-home-story="${story.id}" aria-label="${story.label}: открыть историю" title="${story.label}">${story.emoji}</button>`).join(''):'';

      const shopPanel=`<span class="shopStatus">📚 Обслужено гостей: ${b.orders} · 📖 На полке: ${totalCopies(b.inventory)} · 🐈 В лавке: ${vis.queue.length}</span><div class="bookPanelTabs"><button data-book-tab="visitors" class="${bookTab==='visitors'?'active':''}">Посетители</button><button data-book-tab="shelves" class="${bookTab==='shelves'?'active':''}">Витрина</button><button data-book-tab="supply" class="${bookTab==='supply'?'active':''}">Закупки</button><button data-book-tab="stories" class="${bookTab==='stories'?'active':''}">Журнал</button></div>${note?`<div class="bookMessage" role="status">${note}</div>`:''}${content}`;

      dialog.classList.add('bookshop');

    function bookAction(i){
      const vis=city.books.visitors,id=bookSelected;
      if(city.paused){showBookshop('Город на паузе. Возобнови игру, чтобы обслуживать гостей.');return;}
      if(!id||!vis.queue.includes(id))return;
      const v=BOOK_VISITOR_BY_ID[id],step=vis.progress[id]||0,chapter=chapterForVisitor(v,step);
      if(i!==chapter.right){showBookshop('💬 '+chapter.hint+' Можно предложить другую книгу.');return;}
      const book=chapterBook(chapter),sale=sellBook(city.books.inventory,book.id);
      if(!sale.ok){showBookshop(`📦 «${book.title}» закончилась. Открой вкладку «Закупки» и закажи экземпляры у издательства.`);return;}
      leaveBookVisitor(bookMotion,id);
      finishBookVisit(vis,id);
      city.books.orders++;city.coins+=sale.revenue;gameAudio.coinGain();
      const c=cat('citera');c.xp+=5;c.mood=clamp(c.mood+3,0,100);
      bookSaleFlash={id:book.id,coins:sale.revenue};
      bookSelected=null;
      changed();
      showBookshop(`${v.name}: «${chapter.reply}» · продана «${book.title}» за ${sale.revenue} 🪙, +5 опыта Цитере.${step===2?' История завершена и сохранена в журнале.':''}`);
    }
    function showHospital(note=''){
      const cost=HOSPITAL_COST;
      const patients=city.cats.filter(c=>c.id!=='bella').map(c=>{
        const healthy=c.energy>=95&&c.mood>=95;
        const disabled=city.paused||city.coins<cost||healthy;
        return `<button data-patient="${c.id}" ${disabled?'disabled':''}>${byId[c.id].name} · 💤 ${Math.round(c.energy)}% · ♡ ${Math.round(c.mood)}% ${healthy?'· здоров':`· ${cost} 🪙`}</button>`;
      }).join('');
      show(`<h2>🏥 Больница Тихой бухты</h2><p>Доктор Лев принимает жителей. Консультация восстанавливает 22 бодрости и 10 настроения, а Лев получает 4 опыта.</p>${note?`<p class="shopStatus">${note}</p>`:''}${patients}<button data-close>Вернуться в город</button><small>${city.paused?'Город на паузе. ':''}На счету ${city.coins} 🪙</small>`);
    }
    function hospitalAction(id){
      const patient=city.cats.find(c=>c.id===id&&c.id!=='bella');
      if(!patient)return;
      if(city.paused){showHospital('Продолжи игру, чтобы Лев мог принимать пациентов.');return;}
      if(city.coins<HOSPITAL_COST){showHospital(`Для консультации необходимо ${HOSPITAL_COST} монет.`);return;}
      if(patient.energy>=95&&patient.mood>=95){showHospital('Этому жителю пока не нужна помощь.');return;}
      city.coins-=HOSPITAL_COST;gameAudio.coinSpend();
      patient.energy=clamp(patient.energy+22,0,100);
      patient.mood=clamp(patient.mood+10,0,100);
      const doctor=cat('lev');doctor.xp+=4;
      if(doctor.xp>=doctor.level*18&&doctor.level<100){doctor.xp-=doctor.level*18;doctor.level++;}
      changed();showHospital(`${byId[id].name} получил помощь доктора Льва. +22 бодрости, +10 настроения.`);
    }

      if(button.dataset.cafeView){

          const active=option.dataset.cafeView===view;
          option.classList.toggle('active',active);
          option.setAttribute('aria-pressed',String(active));
        }
        return;
      }
      if(button.hasAttribute('data-cafe-interior-order')){e.stopImmediatePropagation();coffeeAction('order');return;}
      if(button.hasAttribute('data-cafe-interior-manage')){
        e.stopImmediatePropagation();selected='cafe';renderUI();showCafeOpening();
      }
    },true);
    // Mobile Safari permits playback only after a real user gesture.
    // A quiet first touch begins the soundtrack; opening the game never autoplays.
    document.addEventListener('pointerdown',()=>{if(city)gameAudio.unlock();},true);
    document.addEventListener('keydown',()=>{if(city)gameAudio.unlock();},true);

    document.getElementById('places').onclick=showPlaces;

    document.getElementById('soundToggle').onclick=()=>{gameAudio.setMusic(!gameAudio.preferences.music);updateAudioUI();};
    document.getElementById('speed').onclick=()=>{speedFactor=toggleTimeSpeed(speedFactor);updateSpeedUI();notice(speedFactor===1?'Время снова идёт как обычно.':`Время ускорено в ${FAST_FORWARD_MULTIPLIER} раз. Нажми ещё раз, чтобы замедлить.`);};
    document.getElementById('pause').onclick=()=>{city.paused=!city.paused;gameAudio.setPaused(city.paused);notice(city.paused?'Город на паузе.':'Город снова живёт.');changed();};
    dialog.addEventListener('click',e=>{
      const button=e.target.closest('button[data-audio-toggle],button[data-lighting-toggle]');if(!button)return;
      e.stopImmediatePropagation();

    dialog.addEventListener('click',e=>{
      const button=e.target.closest('button');if(!button)return;

      if(d.locationManage){e.stopPropagation();const owner=locationInfo[d.locationManage]?.owner;if(!owner)return;if(owner==='bella'){selected=owner;close();renderUI();notice('Открыта карточка Беллы.');}else showHomeUpgrades(owner,'location');return;}
      if(d.locationWork){e.stopPropagation();sendToLocation(d.locationWork,locationInfo[d.locationWork].worker,'work');return;}
      if(d.locationVisit){e.stopPropagation();sendToLocation(d.locationVisit,currentVisitor(),'walk');return;}
      if(button.hasAttribute('data-location-cafe')){e.stopPropagation();selected='cafe';renderUI();showCafeOpening();}
    },true);
    dialog.addEventListener('click',e=>{
      const patientButton=e.target.closest('button[data-patient]');
      if(patientButton)hospitalAction(patientButton.dataset.patient);
    });
    dialog.addEventListener('click',async e=>{
      if(!['restoreBeforeShelves','restoreBeforeMemories','restoreBeforeCitera'].includes(e.target.closest('button')?.id))return;
      e.stopImmediatePropagation();
      const backup=e.target.closest('button').id;
      const selectedBackup={restoreBeforeCitera:['before-citera-home-v1','личных комнат Цитеры'],restoreBeforeMemories:['before-home-memories-v1','семейного альбома'],restoreBeforeShelves:['before-book-shelves-v1','витрины']}[backup];
      const saved=await read(selectedBackup[0]).catch(()=>null);
      if(!saved||!valid(saved)){close();notice('Резервная копия отсутствует.');return;}
      if(confirm(`Восстановить город до добавления ${selectedBackup[1]}? Текущий прогресс будет заменён.`)){
        city=sanitize(saved);city.savedAt=Date.now();changed();notice('Резервная копия восстановлена.');
      }
      close();
    },true);
    dialog.addEventListener('click',e=>{
      const button=e.target.closest('button');if(!button)return;
      const d=button.dataset;
      if(d.bookMode){
        e.stopImmediatePropagation();
        if(!['shop','home'].includes(d.bookMode)||d.bookMode===bookMode)return;
        bookMode=d.bookMode;bookRoom=bookMode==='home'?'lounge':'bookshop';
        showBookshop();return;
      }
      if(d.bookRoom){
        e.stopImmediatePropagation();bookRoom=d.bookRoom;
        document.getElementById('bookScene').dataset.room=bookRoom;
        for(const item of dialog.querySelectorAll('[data-book-room]')){const on=item.dataset.bookRoom===bookRoom;item.classList.toggle('active',on);item.setAttribute('aria-pressed',String(on));}
        return;
      }
      if(d.bookTab){e.stopImmediatePropagation();bookTab=d.bookTab;bookSelected=null;bookSceneSelected=null;bookFocused=null;showBookshop();return;}
      if(button.hasAttribute('data-book-shelf')){e.stopImmediatePropagation();bookTab='shelves';bookSelected=null;bookSceneSelected=null;bookFocused=null;showBookshop();return;}
      if(d.bookShelfFilter){e.stopImmediatePropagation();bookShelfFilter=d.bookShelfFilter;bookFocused=null;showBookshop();return;}
      if(d.bookCover){e.stopImmediatePropagation();bookFocused=d.bookCover;bookTab='shelves';showBookshop();return;}
      if(button.hasAttribute('data-book-cover-back')){e.stopImmediatePropagation();bookFocused=null;showBookshop();return;}
      if(d.bookFromCover){e.stopImmediatePropagation();bookTab='supply';bookSupplier=BOOK_BY_ID[d.bookFromCover].supplier;bookFocused=null;showBookshop();return;}
      if(d.bookScene){e.stopImmediatePropagation();if(availableBookScene(city.books.visitors.queue,city.books.scenes)?.id!==d.bookScene)return;bookSelected=null;bookSceneSelected=d.bookScene;bookTab='visitors';showBookshop();return;}
      if(d.bookSceneChoice!==undefined){e.stopImmediatePropagation();bookSceneAction(Number(d.bookSceneChoice));return;}
      if(button.hasAttribute('data-book-scene-back')){e.stopImmediatePropagation();bookSceneSelected=null;showBookshop();return;}
      if(d.bookSupplier){e.stopImmediatePropagation();bookSupplier=d.bookSupplier;showBookshop();return;}
      if(d.bookBuy){
        e.stopImmediatePropagation();
        if(city.paused){showBookshop('Сними игру с паузы перед заказом книг.');return;}
        const result=orderBook(city.books.inventory,d.bookBuy,Number(d.bookQty),city.coins);
        if(!result.ok){showBookshop(result.error);return;}
        city.coins-=result.cost;gameAudio.coinSpend();changed();
        showBookshop(`📦 Заказано ${d.bookQty} экз. «${BOOK_BY_ID[d.bookBuy].title}». Потрачено ${result.cost} 🪙. Книги уже в пути!`);
        return;
      }
      if(button.hasAttribute('data-book-go-supply')){e.stopImmediatePropagation();bookTab='supply';bookSupplier='needed';bookSelected=null;showBookshop();return;}
      if(d.bookVisitor){e.stopImmediatePropagation();focusBookVisitor(bookMotion,d.bookVisitor);bookSelected=d.bookVisitor;bookSceneSelected=null;bookTab='visitors';bookRoom='bookshop';showBookshop();return;}
      if(d.bookChoice!==undefined){e.stopImmediatePropagation();bookAction(Number(d.bookChoice));return;}
      if(button.hasAttribute('data-book-back')){e.stopImmediatePropagation();bookSelected=null;bookSceneSelected=null;showBookshop();return;}
      if(button.hasAttribute('data-book-refresh')){e.stopImmediatePropagation();showBookshop();return;}
    },true);
      dialog.onclick=async e=>{let t=e.target;if(t.dataset.bookRoom){const room=t.dataset.bookRoom;document.getElementById('bookScene').dataset.room=room;for(const button of dialog.querySelectorAll('[data-book-room]')){const active=button.dataset.bookRoom===room;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));}return;}if(t.dataset.book!==undefined){bookAction(Number(t.dataset.book));return;}if(t.hasAttribute('data-book-refresh')){showBookshop();return;}let id=t.id;if(e.target.hasAttribute('data-close'))close();if(t.hasAttribute('data-save-health-back')){showSettings();return;}if(t.hasAttribute('data-offline-retry')){navigator.serviceWorker?.getRegistration('./').then(reg=>reg?.active?.postMessage({type:'CACHE_ALL'})).catch(()=>{});requestOfflineStatus();return;}if(id==='checkSave'){const storageRequest=requestPersistentStorage(navigator.storage);await showSaveHealth(storageRequest);return;}if(id==='import')document.getElementById('file').click();if(id==='export'){await write().catch(saveWarning);let blob=new Blob([JSON.stringify(city,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tihaya-buhta-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);close();notice('Копия сохранения загружена. Сохрани файл в «Файлы».');}if(id==='restore'||id==='restoreBeforeInventory'||id==='restoreBefore2D'||id==='restoreBeforePaths'){let prev=await read(id==='restoreBeforeInventory'?'before-book-inventory-v1':id==='restoreBefore2D'?'before-map-2d-v1':id==='restoreBeforePaths'?'before-paths-2d-v1':'previous').catch(()=>null);if(!prev||!valid(prev)){notice('Предыдущей исправной копии пока нет.');close();return;}if(confirm('Заменить текущий город предыдущей копией?')){city=sanitize(prev);city.savedAt=Date.now();changed();notice('Предыдущая копия восстановлена.');}close();}};
    document.getElementById('file').onchange=async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>200000){notice('Файл слишком большой.');close();return;}try{let data=JSON.parse(await f.text());if(!valid(data))throw Error('Неверный формат или версия файла.');if(!confirm('Заменить текущий город содержимым этого файла?'))return;city=sanitize(data);city.savedAt=Date.now();changed();close();notice('Город восстановлен из файла.');}catch(err){close();notice(`Не удалось импортировать: ${err.message}`);}};

    let map=null;
    function focusCity(x,y){map?.focus(x,y);}
    function frame(now){
      const dt=clamp((now-lastFrame)/1000,0,.1);
      lastFrame=now;
      simulate(dt*speedFactor);
      if(city&&now-lastClockRender>=1000){updateGameClock();lastClockRender=now;}
      map?.render(now);
      requestAnimationFrame(frame);
    }
    async function preserveOldMap(saved){if(!saved)return;for(const [limit,key] of [[6,'before-map-2d-v1'],[8,'before-paths-2d-v1'],[10,'before-book-inventory-v1'],[11,'before-book-shelves-v1'],[12,'before-home-memories-v1'],[13,'before-citera-home-v1']]){if(saved.version>=limit||await read(key))continue;await new Promise((resolve,reject)=>{const tx=db.transaction('saves','readwrite');tx.objectStore('saves').put(saved,key);tx.oncomplete=resolve;tx.onerror=reject;});}}
    async function start(){
      try{
        db=await openDB();
        const saved=await read(KEY),previous=await read('previous');
        const choice=chooseStoredSave(saved,previous,valid),source=choice.source;
        lastStoredMarker=valid(saved)?saveMarker(saved):null;
        lastWriteStamp=Math.max(0,Number.isFinite(saved?.savedAt)?saved.savedAt:0,Number.isFinite(previous?.savedAt)?previous.savedAt:0);
        recoverySnapshot=choice.recovered?source:null;
        await preserveOldMap(source);
        city=source?sanitize(source):initial();
        if(!source&&saved)notice('Сохранение повреждено или создано другой версией. Начат новый город.');
        else if(source){
          offline();
          if(choice.recovered)notice('Прогресс восстановлен из исправной резервной копии.');
          else if(source.version<FORMAT)notice('Данные обновлены. Прежние монеты, покупки, книги и воспоминания сохранены.');
        }else notice('Коснись кота или выбери жителя в панели.');
        const delivered=receiveBookShipments(city.books.inventory);
        if(delivered.length)notice(`📦 Получено поставок: ${delivered.length}. Книги ждут на полке.`);
        await write();
      }
      catch(err){city=city||initial();notice('Автосохранение недоступно. Экспортируй прогресс через ☰.');}
      gameAudio.setPaused(city.paused);updateAudioUI();updateSpeedUI();
      try{map=createMap({canvas,catArt:{...CAT_ART,bella:{src:'./assets/cats/bella-hello-kitty-v1.webp'}},getCity:()=>city,getSelected:()=>selected,onSelect:id=>{selected=id;renderUI();notice('Выбран житель: '+byId[id].name+'.');},onLocation:id=>showLocation(id),onNotice:notice});renderUI();requestAnimationFrame(frame);}
      catch(err){notice('Не удалось открыть карту: '+err.message);}
      setupOfflineCaching();
      if(!await welcomeWasSeen())showWelcome();
      setInterval(()=>{if(dirty&&!saveConflict)write().catch(saveWarning)},15000);
      setInterval(()=>{
        if(!city)return;
        if(city.books.inventory.shipments.length){const deliveries=receiveBookShipments(city.books.inventory);if(deliveries.length){changed();notice(`📦 Книжная лавка: прибыло ${deliveries.reduce((n,s)=>n+s.qty,0)} экз.`);if(!overlay.hidden&&dialog.classList.contains('bookshop')&&bookTab==='supply')showBookshop('📦 Заказ доставлен и книги появились на полке!');}}
        if(city.paused||overlay.hidden||!dialog.classList.contains('bookshop'))return;
        if(bringNextBookVisitor(city.books.visitors)){changed();if(bookTab==='visitors'&&!bookSelected)showBookshop('🐾 В лавку заглянул новый посетитель!');}
      },3000);
      function suspendForBackground(){
        if(hiddenAt!==null)return;
        hiddenAt=Date.now();
        clearTimeout(saveTimer);
        write().catch(saveWarning);
      }
      function resumeFromBackground(){
        if(hiddenAt===null)return;
        const elapsed=secondsSince(hiddenAt);
        hiddenAt=null;
        offline(elapsed);
        changed(); // Immediately commit the offline reward and its consumed time.
        lastFrame=performance.now();
      }
      document.addEventListener('visibilitychange',()=>{
        gameAudio.sync();
        if(document.hidden)suspendForBackground();else resumeFromBackground();
        lastFrame=performance.now();
      });
      window.addEventListener('pagehide',suspendForBackground);
      window.addEventListener('pageshow',()=>{if(!document.hidden)resumeFromBackground();});
    }
    start();
})();
