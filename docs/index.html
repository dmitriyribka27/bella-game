    function showGuide(){show(`<h2>Добро пожаловать в бухту</h2><p>Коснись кота, чтобы выбрать жителя. Коты сами работают, едят и отдыхают. Назначай занятия, помогай с настроением и улучшай их дома.</p><p>Коснись здания на карте, чтобы открыть его окно. Там можно отправить жителя к входу по дорожке, открыть существующие занятия или управление домом. Кнопка «Места» покажет все доступные локации. Обычные жилые дома без жителей не открываются.</p><p>Перетаскивай город одним пальцем, меняй масштаб двумя. Пауза останавливает жизнь котов; сохранения хранятся в Safari.</p><p>Кент работает в ратуше, Мия — в обсерватории, Лев лечит жителей в больнице. В лавке Цитеры гости входят через дверь, подходят к полкам, а при начале беседы идут к кассе. После покупки они уходят с книгой. На вкладке «Витрина» можно рассматривать обложки и проверять остатки. В «Закупках» пополняй склад: доставка займёт немного реального времени, даже если выйти из игры. Когда двое гостей заговорят у полок, присоединяйся к их небольшой истории. Кофейню Рыжего можно открыть через поручения.</p><p>В доме Рыжего нажимай на камин, кухню и кровать. В здании Цитеры выбери «Личные комнаты» и исследуй диван и книгу у кровати. В доме Беллы можно открыть три истории, касаясь шариков, стеллажа и кровати. В доме Льва исследуй находку в мастерской, прыгай по лазалкам и отдыхай в гамаке: у каждого предмета своя маленькая история. В доме Кента можно открыть указ мэра, сыграть на террасе и узнать, как Белла спасла его холодной зимой в Адыгее. Первый выбор сохраняет воспоминание в семейном альбоме. Альбом можно открыть через меню ☰; сценки можно повторять без штрафов. А в маяк, лодочный домик, на почту и в оранжерею можно просто зайти и рассматривать декорации без заданий. На рынке Белла может купить свои любимые вкусняшки за городские монеты.</p><button data-close>Играть</button>`);}

    document.getElementById('places').onclick=showPlaces;
    document.getElementById('settings').onclick=()=>show(`<h2>Город и сохранение</h2><p>Игра сохраняется автоматически в Safari. Для переноса на другое устройство экспортируй файл JSON и импортируй его там.</p><button data-open-album>📖 Семейный альбом · ${city.memories.length}/${HOME_STORIES.length}</button><button id="export">Экспортировать сохранение</button><button id="import">Импортировать файл</button><button id="restore">Вернуть предыдущую копию</button><button id="restoreBeforeCitera">Копия до личных комнат Цитеры</button><button id="restoreBeforeMemories">Копия до семейного альбома</button><button id="restoreBeforeShelves">Копия до новой витрины</button><button id="restoreBeforeInventory">Копия до системы закупок</button><button id="restoreBefore2D">Копия до перехода в 2D</button><button id="restoreBeforePaths">Копия до новых маршрутов</button><button id="help">Как играть</button><button data-close>Закрыть</button><small>Не очищай данные Safari до экспорта. Формат сохранения: ${FORMAT}.</small>`);
    document.getElementById('pause').onclick=()=>{city.paused=!city.paused;notice(city.paused?'Город на паузе.':'Город снова живёт.');changed();};
    dialog.addEventListener('click',e=>{
      const button=e.target.closest('button');if(!button)return;
      const d=button.dataset;
      if(d.locationOpen){e.stopPropagation();focusCity(...LOCATION_POINTS[d.locationOpen]);showLocation(d.locationOpen);return;}
      if(d.locationHome){e.stopPropagation();const owner=locationInfo[d.locationHome].owner;sendToLocation(d.locationHome,owner,owner==='bella'?'walk':'rest');return;}
      if(d.locationManage){e.stopPropagation();selected=locationInfo[d.locationManage].owner;close();renderUI();notice('Открыта карточка жителя и улучшения дома.');return;}
      if(d.locationWork){e.stopPropagation();sendToLocation(d.locationWork,locationInfo[d.locationWork].worker,'work');return;}

    dialog.addEventListener('click',e=>{
      const patientButton=e.target.closest('button[data-patient]');
      if(patientButton)hospitalAction(patientButton.dataset.patient);
    });
    dialog.addEventListener('click',async e=>{
      if(!['restoreBeforeShelves','restoreBeforeMemories','restoreBeforeCitera'].includes(e.target.closest('button')?.id))return;
      e.stopImmediatePropagation();
      const backup=e.target.closest('button').id;
      const selectedBackup={restoreBeforeCitera:['before-citera-home-v1','личных комнат Цитеры'],restoreBeforeMemories:['before-home-memories-v1','семейного альбома'],restoreBeforeShelves:['before-book-shelves-v1','витрины']}[backup];
      const saved=await read(selectedBackup[0]).catch(()=>null);
      if(!saved||!valid(saved)){close();notice('Резервная копия отсутствует.');return;}
      if(confirm(`Восстановить город до добавления ${selectedBackup[1]}? Текущий прогресс будет заменён.`)){
        city=sanitize(saved);city.savedAt=Date.now();changed();notice('Резервная копия восстановлена.');
      }
      close();
    },true);
    dialog.addEventListener('click',e=>{
      const button=e.target.closest('button');if(!button)return;
      const d=button.dataset;
      if(d.bookMode){
        e.stopImmediatePropagation();
        if(!['shop','home'].includes(d.bookMode)||d.bookMode===bookMode)return;
        bookMode=d.bookMode;bookRoom=bookMode==='home'?'lounge':'bookshop';
        showBookshop();return;
      }
      if(d.bookRoom){
        e.stopImmediatePropagation();bookRoom=d.bookRoom;
        document.getElementById('bookScene').dataset.room=bookRoom;
        for(const item of dialog.querySelectorAll('[data-book-room]')){const on=item.dataset.bookRoom===bookRoom;item.classList.toggle('active',on);item.setAttribute('aria-pressed',String(on));}
        return;
      }
      if(d.bookTab){e.stopImmediatePropagation();bookTab=d.bookTab;bookSelected=null;bookSceneSelected=null;bookFocused=null;showBookshop();return;}
      if(button.hasAttribute('data-book-shelf')){e.stopImmediatePropagation();bookTab='shelves';bookSelected=null;bookSceneSelected=null;bookFocused=null;showBookshop();return;}
      if(d.bookShelfFilter){e.stopImmediatePropagation();bookShelfFilter=d.bookShelfFilter;bookFocused=null;showBookshop();return;}
      if(d.bookCover){e.stopImmediatePropagation();bookFocused=d.bookCover;bookTab='shelves';showBookshop();return;}
      if(button.hasAttribute('data-book-cover-back')){e.stopImmediatePropagation();bookFocused=null;showBookshop();return;}
      if(d.bookFromCover){e.stopImmediatePropagation();bookTab='supply';bookSupplier=BOOK_BY_ID[d.bookFromCover].supplier;bookFocused=null;showBookshop();return;}
      if(d.bookScene){e.stopImmediatePropagation();if(availableBookScene(city.books.visitors.queue,city.books.scenes)?.id!==d.bookScene)return;bookSelected=null;bookSceneSelected=d.bookScene;bookTab='visitors';showBookshop();return;}
      if(d.bookSceneChoice!==undefined){e.stopImmediatePropagation();bookSceneAction(Number(d.bookSceneChoice));return;}
      if(button.hasAttribute('data-book-scene-back')){e.stopImmediatePropagation();bookSceneSelected=null;showBookshop();return;}
      if(d.bookSupplier){e.stopImmediatePropagation();bookSupplier=d.bookSupplier;showBookshop();return;}
      if(d.bookBuy){
        e.stopImmediatePropagation();
        if(city.paused){showBookshop('Сними игру с паузы перед заказом книг.');return;}
        const result=orderBook(city.books.inventory,d.bookBuy,Number(d.bookQty),city.coins);
        if(!result.ok){showBookshop(result.error);return;}
        city.coins-=result.cost;changed();
        showBookshop(`📦 Заказано ${d.bookQty} экз. «${BOOK_BY_ID[d.bookBuy].title}». Потрачено ${result.cost} 🪙. Книги уже в пути!`);
        return;
      }
      if(button.hasAttribute('data-book-go-supply')){e.stopImmediatePropagation();bookTab='supply';bookSupplier='needed';bookSelected=null;showBookshop();return;}
      if(d.bookVisitor){e.stopImmediatePropagation();focusBookVisitor(bookMotion,d.bookVisitor);bookSelected=d.bookVisitor;bookSceneSelected=null;bookTab='visitors';bookRoom='bookshop';showBookshop();return;}
      if(d.bookChoice!==undefined){e.stopImmediatePropagation();bookAction(Number(d.bookChoice));return;}
      if(button.hasAttribute('data-book-back')){e.stopImmediatePropagation();bookSelected=null;bookSceneSelected=null;showBookshop();return;}
      if(button.hasAttribute('data-book-refresh')){e.stopImmediatePropagation();showBookshop();return;}
    },true);
    dialog.onclick=async e=>{let t=e.target;if(t.dataset.bookRoom){const room=t.dataset.bookRoom;document.getElementById('bookScene').dataset.room=room;for(const button of dialog.querySelectorAll('[data-book-room]')){const active=button.dataset.bookRoom===room;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));}return;}if(t.dataset.book!==undefined){bookAction(Number(t.dataset.book));return;}if(t.hasAttribute('data-book-refresh')){showBookshop();return;}let id=t.id;if(e.target.hasAttribute('data-close'))close();if(id==='help')showGuide();if(id==='import')document.getElementById('file').click();if(id==='export'){await write().catch(()=>{});let blob=new Blob([JSON.stringify(city,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tihaya-buhta-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);close();notice('Копия сохранения загружена. Сохрани файл в «Файлы».');}if(id==='restore'||id==='restoreBeforeInventory'||id==='restoreBefore2D'||id==='restoreBeforePaths'){let prev=await read(id==='restoreBeforeInventory'?'before-book-inventory-v1':id==='restoreBefore2D'?'before-map-2d-v1':id==='restoreBeforePaths'?'before-paths-2d-v1':'previous').catch(()=>null);if(!prev||!valid(prev)){notice('Предыдущей исправной копии пока нет.');close();return;}if(confirm('Заменить текущий город предыдущей копией?')){city=sanitize(prev);city.savedAt=Date.now();changed();notice('Предыдущая копия восстановлена.');}close();}};
    document.getElementById('file').onchange=async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>200000){notice('Файл слишком большой.');close();return;}try{let data=JSON.parse(await f.text());if(!valid(data))throw Error('Неверный формат или версия файла.');if(!confirm('Заменить текущий город содержимым этого файла?'))return;city=sanitize(data);city.savedAt=Date.now();changed();close();notice('Город восстановлен из файла.');}catch(err){close();notice(`Не удалось импортировать: ${err.message}`);}};

    let map=null;
    function focusCity(x,y){map?.focus(x,y);}
    function frame(now){const dt=clamp((now-lastFrame)/1000,0,.1);lastFrame=now;simulate(dt);map?.render(now);requestAnimationFrame(frame);}
    async function preserveOldMap(saved){if(!saved)return;for(const [limit,key] of [[6,'before-map-2d-v1'],[8,'before-paths-2d-v1'],[10,'before-book-inventory-v1'],[11,'before-book-shelves-v1'],[12,'before-home-memories-v1'],[13,'before-citera-home-v1']]){if(saved.version>=limit||await read(key))continue;await new Promise((resolve,reject)=>{const tx=db.transaction('saves','readwrite');tx.objectStore('saves').put(saved,key);tx.oncomplete=resolve;tx.onerror=reject;});}}
    async function start(){
      try{db=await openDB();const saved=await read(KEY),previous=await read('previous');const restored=valid(previous)&&(!valid(saved)||previous.version>saved.version);const source=restored?previous:saved;await preserveOldMap(source);city=valid(source)?sanitize(source):initial();if(saved&&!valid(source))notice('Сохранение повреждено или создано другой версией. Начат новый город.');else if(source){offline();if(restored)notice('Восстановлен прогресс из более новой резервной копии. Закрой старые вкладки игры.');else if(source.version<FORMAT)notice('У Цитеры появились личные истории. Прежние монеты, книги, заказы и воспоминания сохранены.');}else notice('Коснись кота или выбери жителя в панели.');const delivered=receiveBookShipments(city.books.inventory);if(delivered.length)notice(`📦 Получено поставок: ${delivered.length}. Книги ждут на полке.`);await write();}
      catch(err){city=city||initial();notice('Автосохранение недоступно. Экспортируй прогресс через ☰.');}
      try{map=createMap({canvas,catArt:CAT_ART,getCity:()=>city,getSelected:()=>selected,onSelect:id=>{selected=id;renderUI();notice('Выбран житель: '+byId[id].name+'.');},onLocation:id=>showLocation(id),onNotice:notice});renderUI();requestAnimationFrame(frame);}
      catch(err){notice('Не удалось открыть карту: '+err.message);}
      setInterval(()=>{if(dirty)write().catch(()=>{})},15000);
      setInterval(()=>{
        if(!city)return;
        if(city.books.inventory.shipments.length){const deliveries=receiveBookShipments(city.books.inventory);if(deliveries.length){changed();notice(`📦 Книжная лавка: прибыло ${deliveries.reduce((n,s)=>n+s.qty,0)} экз.`);if(!overlay.hidden&&dialog.classList.contains('bookshop')&&bookTab==='supply')showBookshop('📦 Заказ доставлен и книги появились на полке!');}}
        if(city.paused||overlay.hidden||!dialog.classList.contains('bookshop'))return;
        if(bringNextBookVisitor(city.books.visitors)){changed();if(bookTab==='visitors'&&!bookSelected)showBookshop('🐾 В лавку заглянул новый посетитель!');}
      },3000);
      document.addEventListener('visibilitychange',()=>{if(document.hidden&&dirty)write().catch(()=>{});lastFrame=performance.now();});
    }
    start();
})();
