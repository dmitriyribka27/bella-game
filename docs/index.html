    async function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('saves');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}

    function addHome(d){let [x,z]=spot(...d.home),g=new T.Group();g.position.set(x,.47,z);g.userData.pick=d.id;world.add(g);homes.set(d.id,g);

    function makeCafe(){let [x,z]=spot(...cafeSite.home),g=new T.Group();g.position.set(x,.47,z);g.userData.pick='cafe';world.add(g);

      if(c.built){cylinder(g,.89,.9,1.07,0,.77,0,'#cf9d79',18);for(let i=0;i<11;i++){let a=i*Math.PI*2/11;rounded(g,.045,.77,.05,Math.cos(a)*.88,.87,Math.sin(a)*.88,'#e2b38d',.016)}

    function updateCafe(){let sign=[city.coffee.built,city.coffee.style].join('/');if(sign!==coffeeState){if(coffeeMesh){world.remove(coffeeMesh);coffeeMesh.traverse(o=>{if(o.geometry)o.geometry.dispose()})}makeCafe();needsRender=true}}
    let catShadowTexture=null;
    function addCat(d){
      let g=new T.Group();g.userData.pick=d.id;world.add(g);
      const art=CAT_ART[d.id],height={kent:1.95,mia:1.95,lev:1.95,citera:1.9,ryzhiy:1.85,bella:2.1}[d.id];
      let texture=new T.TextureLoader().load(art.src,()=>{needsRender=true});
      texture.colorSpace=T.SRGBColorSpace;
      let figure=new T.Sprite(new T.SpriteMaterial({map:texture,transparent:true,alphaTest:.035,depthWrite:false,toneMapped:false}));
      figure.center.set(.5,0);figure.position.y=.08;

      if(!catShadowTexture){
        let c=document.createElement('canvas');c.width=c.height=64;let q=c.getContext('2d');
        let gradient=q.createRadialGradient(32,32,3,32,32,31);

      let tag=document.createElement('div');tag.className='catLabel';tag.textContent=d.name;

    function updateLabels(){
      if(!camera||!world)return;
      let w=innerWidth,h=innerHeight,entries=[],occupied=[];
      for(let c of city.cats){
        let tag=catLabels.get(c.id),[x,z]=spot(c.x,c.y);
        let p=new T.Vector3(x*world.scale.x,2.76,z*world.scale.z).project(camera);
        let px=(p.x+1)*w/2,py=(1-p.y)*h/2;
        let visible=p.z>-1&&p.z<1&&px>20&&px<w-20&&py>118&&py<h*.69;
        tag.style.display=visible?'block':'none';
        if(visible)entries.push({id:c.id,tag,px,py});
      }
      entries.sort((a,b)=>(b.id===selected)-(a.id===selected)||a.py-b.py);
      for(let e of entries){
        let width=e.tag.offsetWidth||60,height=e.tag.offsetHeight||26,placed=false;
        for(let [dx,dy] of [[0,0],[0,-34],[0,-68],[-65,-16],[65,-16],[-65,-50],[65,-50],[0,-102]]){
          let x=e.px+dx,y=e.py+dy,box={left:x-width/2-3,right:x+width/2+3,top:y-height-3,bottom:y+3};
          if(box.left<6||box.right>w-6||box.top<114||box.bottom>h*.7)continue;
          if(occupied.some(o=>box.left<o.right&&box.right>o.left&&box.top<o.bottom&&box.bottom>o.top))continue;
          e.tag.style.left=x+'px';e.tag.style.top=y+'px';e.tag.classList.toggle('selected',selected===e.id);
          occupied.push(box);placed=true;break;
        }
        if(!placed)e.tag.style.display='none';
      }
    }
    function updateCats(){
      for(let c of city.cats){
        let g=catMeshes.get(c.id),[x,z]=spot(c.x,c.y);
        let moving=Math.hypot(c.target[0]-c.x,c.target[1]-c.y)>.06&&!city.paused;
        g.position.set(x,.48+(moving?Math.sin(time*8+c.x*3)*.018:0),z);
        g.userData.figure.material.rotation=moving?Math.sin(time*8+c.x*3)*.018:0;
        g.userData.ring.visible=selected===c.id;
      }
    }

    function focusCity(x,y){if(!controls)return;let [wx,wz]=spot(x,y),delta=new T.Vector3(wx*world.scale.x-controls.target.x,0,wz*world.scale.z-controls.target.z);controls.target.add(delta);camera.position.add(delta);controls.update();needsRender=true}
    function resize3D(){if(!renderer)return;let w=innerWidth,h=innerHeight;document.body.style.setProperty('--screen-w',w+'px');document.body.style.setProperty('--screen-h',h+'px');let size=27;camera.left=-size*w/h/2;camera.right=size*w/h/2;camera.top=size/2;camera.bottom=-size/2;camera.updateProjectionMatrix();renderer.setSize(w,h,false);needsRender=true}
    function init3D(){sceneBase();for(let d of scenicSites)addBuilding(d);
      for(let [x,z,height] of [[6.9,7.65,1.72],[10.62,7.9,1.7],[14.9,5.15,1.5]]){
        let garden=new T.Group();garden.position.set(x,.48,z);world.add(garden);siteFigure(garden,'garden',height);
      }
      for(let d of defs){addHome(d);addCat(d)}makeCafe();updateHomes();updateCats();resize3D();
      let touches=new Map(),blocked=false;canvas.addEventListener('pointerdown',e=>{touches.set(e.pointerId,{x:e.clientX,y:e.clientY,moved:false});if(touches.size>1)blocked=true});
      canvas.addEventListener('pointermove',e=>{let p=touches.get(e.pointerId);if(p&&Math.hypot(e.clientX-p.x,e.clientY-p.y)>9)p.moved=true});
      canvas.addEventListener('pointercancel',e=>{touches.delete(e.pointerId);if(!touches.size)blocked=false});
      canvas.addEventListener('pointerup',e=>{let p=touches.get(e.pointerId);touches.delete(e.pointerId);if(!p||p.moved||blocked||touches.size){if(!touches.size)blocked=false;return}
        let bounds=canvas.getBoundingClientRect();pointer.set(((e.clientX-bounds.left)/bounds.width)*2-1,-((e.clientY-bounds.top)/bounds.height)*2+1);raycaster.setFromCamera(pointer,camera);
        let targets=[...catMeshes.values(),...homes.values(),...scenicSites.map(d=>world.children.find(o=>o.userData.pick===d.id)),coffeeMesh].filter(Boolean);
        let hit=raycaster.intersectObjects(targets,true)[0];if(!hit)return;let node=hit.object;while(node&&!node.userData.pick)node=node.parent;if(!node)return;let id=node.userData.pick;
        if(id==='citera'&&node===homes.get('citera')){showBookshop();needsRender=true;return;}
        if(id==='cafe'||byId[id]){selected=id;renderUI();notice(id==='cafe'?'Кофейня выбрана.':byId[id].name+' выбран'+(['mia','citera','bella'].includes(id)?'а':'')+'.');needsRender=true}
        else{let d=scenicSites.find(q=>q.id===id);if(d)notice(d.name+': пока это часть города. Жители и занятия уже доступны на карте.')}
      });
      renderReady=true;
    }
    let lastDraw=0,resizeTimer;
    function frame(now){let dt=clamp((now-lastFrame)/1000,0,.1);lastFrame=now;if(waveTexture){waveTexture.offset.x=(now*.000007)%1;waveTexture.offset.y=(now*.000003)%1}if(tideFoam)tideFoam.position.z=.035*Math.sin(now*.0008);simulate(dt);controls.update();updateCafe();updateHomes();updateCats();
      if(now-lastDraw>33||needsRender){renderer.render(scene,camera);updateLabels();needsRender=false;lastDraw=now}
      requestAnimationFrame(frame);
    }
    async function start(){try{db=await openDB();let saved=await read(KEY);city=valid(saved)?sanitize(saved):initial();if(saved&&!valid(saved))notice('Сохранение повреждено или создано другой версией. Начат новый город.');else if(saved)offline();else notice('Коснись кота или дома. Коты заботятся о себе сами.');await write();}
      catch(err){city=initial();notice('Хранилище Safari недоступно: игра работает, но сохранение может пропасть.')}
      try{init3D();renderUI();requestAnimationFrame(frame)}
      catch(err){notice('Не удалось открыть 3D: '+err.message+'. Можно вернуться к прежней версии карты.');document.querySelector('.hint').innerHTML='<a href="./legacy-2d.html" style="color:#fff">Открыть прежнюю 2D-версию</a>';}
      setInterval(()=>{if(dirty)write().catch(()=>{})},15000);
      document.addEventListener('visibilitychange',()=>{if(document.hidden&&dirty)write().catch(()=>{})});
    }
    window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(resize3D,250)});start();

})();
